<style>
:root{

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tinta);font:16px/1.55 var(--f-ui);padding-inline:16px}

.wrap{max-width:920px;margin:0 auto;padding-block:20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;padding-bottom:16px;border-bottom:1px solid var(--linea)}
.marca{font:700 13px/1 var(--f-ui);letter-spacing:.2em;color:var(--gris)}
.marca b{color:var(--tinta)} .marca .cr{color:var(--oro)}
h1{font:600 27px/1.1 var(--f-disp);margin:6px 0 2px}

.prog{margin-left:auto;text-align:right;min-width:160px}
.prog .bar{height:8px;border-radius:99px;background:var(--linea);overflow:hidden;margin-top:6px}
.prog .fill{height:100%;background:var(--ok);width:0;transition:width .4s}

.meses{display:flex;gap:8px;position:sticky;top:0;z-index:5;padding:14px 0 10px;background:linear-gradient(var(--bg) 70%,transparent);flex-wrap:wrap}

.dia{background:var(--panel);border:1px solid var(--linea);border-radius:18px;padding:18px;margin-bottom:16px;scroll-margin-top:70px}

.texto.corto:after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(transparent,var(--panel))}
.vermas{margin-top:8px;background:none;border:0;color:var(--azul);font:600 14px var(--f-ui);cursor:pointer;padding:0}
.apoyo{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--azul-suave);color:var(--azul);border:1px solid var(--linea);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}

textarea{width:100%;margin-top:12px;min-height:70px;resize:vertical;font:15px var(--f-ui);color:var(--tinta);background:var(--bg);border:1px solid var(--linea);border-radius:12px;padding:11px 13px}

.guardar{margin-top:10px;display:flex;align-items:center;gap:12px}

.lightbox{position:fixed;inset:0;background:#0B0F1EE8;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.lightbox.on{display:flex} .lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.lightbox .x{position:absolute;top:14px;right:18px;font-size:30px;color:#fff;background:none;border:0;cursor:pointer}
footer{color:var(--suave);font-size:13px;text-align:center;margin-top:30px}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.badge.m{background:var(--azul);color:#fff} .badge.v{background:var(--oro);color:#fff} .badge.c{background:var(--panel);border:1px solid var(--linea);color:var(--gris)}
.titulo{font:600 17px/1.25 var(--f-ui);margin:0 0 4px}
.falta{background:var(--amb-bg);border:1px solid #EBCF9F;color:#7A4A08;border-radius:12px;padding:11px 14px;font-size:14px;margin:0 0 12px}
.reel{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.reel video{height:440px;aspect-ratio:9/16;border-radius:14px;border:1px solid var(--linea);background:#111}
.reel img{height:440px;width:auto;border-radius:14px;border:1px solid var(--linea);cursor:zoom-in}
.reel figure{margin:0} .reel figcaption{font-size:12.5px;color:var(--suave);margin-top:5px}
.leyenda{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:8px;font-size:13.5px}
.leyenda span b{font-weight:700;color:var(--tinta)}
@media (max-width:560px){.galeria img{height:230px}.reel video,.reel img{height:330px}}

<script>
const WEBHOOK = "https://n8n-unonueve-n8n.i5i6e4.easypanel.host/webhook/fabiola-contenido";
const DIAS = [{"fecha": "plan-oct-2026-10-03", "mes": "Octubre", "etiqueta": "Sábado 3 de octubre", "linea": "Masterclass", "falta": "", "tipo": "Reel", "titulo": "Los 3 hábitos que te restan autoridad", "video": "habitos", "palabra": "COMUNICAR", "texto": "¿Sabías que podés tener toda la razón y aun así no sonar con autoridad? 🤔\n\nNo es lo que sabés. Son tres hábitos chiquitos que repetimos sin darnos cuenta:\n1️⃣ Pedir perdón antes de dar tu idea.\n2️⃣ Terminar tus frases como si fueran pregunta.\n3️⃣ Llenar los silencios con «este…» y «no sé si me explico».\n\nEl jueves 15 de octubre a las 7:00 p. m. doy una masterclass gratuita de comunicación por Zoom. Te enseño cómo cambiar cada uno por algo que sí te suma.\n\n👉 Escribí COMUNICAR y te paso el acceso a la masterclass gratuita del jueves 15 de octubre.\n\nNo te falta autoridad. Te sobran hábitos que la esconden. 💜"}, {"fecha": "plan-oct-2026-10-04", "mes": "Octubre", "etiqueta": "Domingo 4 de octubre", "linea": "Carrusel", "falta": "", "tipo": "Carrusel", "post_pid": "sep-viernes18", "palabra": "ESCUCHA", "texto": "¿Alguna vez te diste cuenta de que, mientras la otra persona hablaba, vos ya estabas armando tu respuesta? 🙊\n\nEscuchar no es quedarse callada esperando tu turno. Y cuando no escuchamos, se nota: el equipo deja de proponer, el cliente repite lo mismo y la reunión se alarga. Si sos de carácter fuerte y hablás rápido, esto es para vos. Y si escuchás mucho pero nadie lo nota, también.\n\nTe dejo 3 ejercicios en el carrusel:\n1️⃣ El resumen: «Entonces lo que necesitás es…» antes de responder.\n2️⃣ La pausa de 3: contá hasta 3 cuando el otro termine.\n3️⃣ Una pregunta más: por cada opinión tuya, una pregunta genuina.\n\nGuardalo y probalo en tus próximas 3 conversaciones 📌\n\n👉 Comentá ESCUCHA y te mando por DM la guía gratis «5 claves para escuchar y que se note».\n\nEscuchar no es esperar tu turno. Es el súper poder de quienes lideran. 💜\n\n#Escucha #Comunicación #Liderazgo #LiderazgoFemenino #MujeresQueLideran #EnVozAlta #FabiolaMurillo", "pdf": "ESCUCHA - 5 claves para escuchar y que se note.pdf", "hist_pid": "sep-18-h"}, {"fecha": "plan-oct-2026-10-05", "mes": "Octubre", "etiqueta": "Lunes 5 de octubre", "linea": "Masterclass", "falta": "", "tipo": "Carrusel", "post_pid": "sep-jueves17", "palabra": "COMUNICAR", "texto": "¿Te han dicho «mandona», «intensa» o «difícil» por decir lo que pensás? ¿O sos de las que se guardan todo para no incomodar? 💭\n\nA muchas mujeres no las frena el miedo. Las frena el «demasiado»: demasiado fuertes, demasiado calladas, demasiado algo. Y ninguna está mal.\n\nLa autoridad nace en el punto medio, y cada una llega desde un lado distinto:\n1️⃣ Si tu fuerza incomoda: dosificala, no la apagues.\n2️⃣ Si te guardás: una idea dicha vale más que diez pensadas.\n3️⃣ Firmeza + escucha = autoridad.\n\nEl jueves 15 de octubre a las 7:00 p. m. doy una masterclass gratuita de comunicación por Zoom: cómo ordenar tu mensaje, sostener tu voz y lograr que te escuchen, en una reunión, frente a un equipo o frente a la cámara.\n\n👉 Escribí COMUNICAR y te paso el acceso a la masterclass gratuita del jueves 15 de octubre.\n\nNo sos «demasiado». Sos una líder aprendiendo a usar su voz. 💜", "pdf": null, "hist_pid": "sep-17-h"}, {"fecha": "plan-oct-2026-10-06", "mes": "Octubre", "etiqueta": "Martes 6 de octubre", "linea": "Carrusel", "falta": "", "tipo": "Carrusel", "post_pid": "ago-lunes24", "palabra": "PAUSA", "texto": "¿Sentís que tenés que llenar cada segundo para que no piensen que te quedaste en blanco? ⏸️\n\nEse apuro te juega en contra. Cuando hablás sin parar, tu idea se diluye y los nervios se notan más. El silencio, bien usado, es lo que te da autoridad.\n\nTres claves para usarlo desde tu próxima reunión:\n1️⃣ Callá dos segundos después de tu idea más importante.\n2️⃣ Cambiá el «eh, este» por una pausa.\n3️⃣ Pausá un segundo justo antes de la frase clave.\n\nY si sos de las que hablan rápido y con fuerza, la pausa también es para vos: le da espacio a la otra persona y hace que tu idea pese más.\n\nGuardá este post y probalo esta semana 📌\n\n👉 Comentá PAUSA y te mando por DM la guía gratis «5 claves para dominar la pausa».\n\nQuien domina la pausa, domina la sala. 💜\n\n#Comunicación #Oratoria #HablarEnPúblico #LiderazgoFemenino #MujeresQueLideran #EnVozAlta #FabiolaMurillo", "pdf": "PAUSA - 5 claves para dominar la pausa.pdf"}, {"fecha": "plan-oct-2026-10-07", "mes": "Octubre", "etiqueta": "Miércoles 7 de octubre", "linea": "Masterclass", "falta": "", "tipo": "Reel", "titulo": "La estructura simple", "video": "estructura", "palabra": "COMUNICAR", "texto": "¿Explicás algo y sentís que no te entendieron? 😅\n\nCasi nunca es falta de conocimiento. Es falta de orden: decimos las cosas como las pensamos, no como la otra persona las necesita escuchar.\n\nLa solución es una estructura simple de tres pasos que te ordena cualquier idea en segundos, para una reunión, un audio o una presentación.\n\nEl jueves 15 de octubre a las 7:00 p. m. doy una masterclass gratuita de comunicación por Zoom. Ahí la practicamos en vivo.\n\n👉 Escribí COMUNICAR y te paso el acceso a la masterclass gratuita del jueves 15 de octubre.\n\nCuando tu mensaje tiene orden, tu voz tiene fuerza. 💜"}, {"fecha": "plan-oct-2026-10-08", "mes": "Octubre", "etiqueta": "Jueves 8 de octubre", "linea": "Carrusel", "falta": "", "tipo": "Post", "post_pid": "ago-martes25", "palabra": "PEDIR", "texto": "¿Cuántas veces te quedaste callada esperando que alguien notara todo lo que hacés? 🤐\n\nHacés el trabajo de dos, sostenés al equipo, resolvés lo que nadie ve… y aun así no pedís el aumento, el ascenso o el espacio que te ganaste. Por miedo a parecer «demasiado».\n\nLo que no pedís, no te lo dan. Y pedir no es suerte ni atrevimiento: es comunicar tu valor con claridad.\n✔️ Sabé exactamente qué vas a pedir.\n✔️ Llevá tus resultados, no tus horas extra.\n✔️ Decilo sin disculparte y después callá.\n\nY si lo tuyo es pedir con mucha fuerza, la clave es la misma: claridad y resultados, no presión.\n\n👉 Comentá PEDIR y te mando por DM la guía gratis «5 claves para pedir lo que merecés».\n\nNo estás pidiendo un favor. Estás poniendo sobre la mesa lo que ya construiste. 💜\n\n#LiderazgoFemenino #MujeresQueLideran #DesarrolloProfesional #Negociación #Comunicación #EnVozAlta #FabiolaMurillo", "pdf": "PEDIR - 5 claves para pedir lo que mereces.pdf", "hist_pid": "ago-martes25-h"}, {"fecha": "plan-oct-2026-10-09", "mes": "Octubre", "etiqueta": "Viernes 9 de octubre", "linea": "Masterclass", "falta": "", "tipo": "Carrusel", "post_pid": "sep-jueves24", "palabra": "COMUNICAR", "texto": "Te felicitan por un logro y lo primero que te sale es: «Ay, tuve suerte». 🍀\n\nNo. Lo hiciste vos.\n\nAlgunas minimizan: «No fue para tanto», «Fue trabajo del equipo». Otras se van al otro extremo y sobre-defienden cada detalle. Son dos caminos distintos que llevan al mismo techo: no comunicar tu valor con naturalidad.\n\nNombrá tu valor así:\n1️⃣ Si minimizás: decí «Lo logré yo», sin disculpas ni «pero».\n2️⃣ Si sobre-defendés: bajá el tono y subí los hechos. Los datos hablan solos.\n3️⃣ Recibí la felicitación con un «Gracias, me costó y me siento orgullosa».\n\nNi disculpa ni defensa: solo la verdad.\n\nGuardá este post para la próxima vez que te feliciten 📌\n\nEl jueves 15 de octubre a las 7:00 p. m. doy una masterclass gratuita de comunicación por Zoom.\n\n👉 Escribí COMUNICAR y te paso el acceso a la masterclass gratuita del jueves 15 de octubre.\n\nTu trabajo no necesita permiso para ser reconocido. 💜\n\n#LiderazgoFemenino #MujeresQueLideran #Autoestima #CrecimientoProfesional #Comunicación #EnVozAlta #FabiolaMurillo", "pdf": null, "hist_pid": "sep-24-h"}, {"fecha": "plan-oct-2026-10-10", "mes": "Octubre", "etiqueta": "Sábado 10 de octubre", "linea": "VOCES CR", "falta": "", "tipo": "Reel", "titulo": "¿Qué es VOCES CR?", "video": "voces-que-es", "palabra": "VOCES CR", "texto": "¿Cuánto tiempo hace que no estás en un lugar lleno de gente que quiere conocerte? 🤝\n\nVOCES CR 2026 es el evento anual de IC&SF Costa Rica: una noche de networking y speakers para conectar, conversar y darle voz a tu marca, tu propósito o tu negocio.\n\n🎤 Speakers en tarima\n🍽️ Cena\n🏷️ Stands de marcas\n🤝 Más de 100 personas para conversar\n\n📅 Sábado 7 de noviembre · recepción 5:30 p. m. · programa 6:00 p. m.\n\n👉 Escribime VOCES CR (en comentarios o por mensaje) y te mando por chat la información y el enlace para reservar.\n\nUnimos voces. Multiplicamos impacto. ✨"}, {"fecha": "plan-oct-2026-10-11", "mes": "Octubre", "etiqueta": "Domingo 11 de octubre", "linea": "Masterclass", "falta": "", "tipo": "Reel", "titulo": "Sostener tu voz", "video": "sostener", "palabra": "COMUNICAR", "texto": "¿Cuántas veces retiraste una idea apenas alguien la cuestionó? 🙊\n\nO dijiste tu precio y enseguida ofreciste rebaja. No es debilidad: es que nadie nos enseñó a sostener un silencio incómodo.\n\nSostener tu voz no es imponer. Es quedarte en lo que dijiste y darle tiempo a la otra persona para procesarlo.\n\nEl jueves 15 de octubre a las 7:00 p. m. doy una masterclass gratuita de comunicación por Zoom. Te llevás las frases exactas para ese momento.\n\n👉 Escribí COMUNICAR y te paso el acceso a la masterclass gratuita del jueves 15 de octubre.\n\nDejá de pedir permiso para ocupar tu lugar. 💜"}, {"fecha": "plan-oct-2026-10-12", "mes": "Octubre", "etiqueta": "Lunes 12 de octubre", "linea": "Carrusel", "falta": "", "tipo": "Carrusel", "post_pid": "sep-viernes25", "palabra": "MENSAJE", "texto": "¿Terminás de hablar en una reunión y a los cinco minutos nadie recuerda lo que dijiste? 🧠\n\nNo es que tu idea no valga. Es que llegó envuelta en demasiado contexto y se perdió en el camino.\n\n3 ejercicios de menos de 5 minutos para que tu mensaje se quede:\n1️⃣ La idea en 1 frase: si no cabe en una oración, todavía no la tenés clara.\n2️⃣ El mini-relato: acompañá tu dato con una historia de 20 segundos («a mí me pasó…»).\n3️⃣ Conclusión primero: «La conclusión es X. Ahora te cuento por qué».\n\nElegí uno y practicalo hoy antes de tu próxima conversación importante.\n\nGuardá este post para tenerlo a mano 📌\n\n👉 Comentá MENSAJE y te mando por DM la guía gratis «5 claves para que tu mensaje se recuerde».\n\nNo se recuerda a quien más sabe, sino a quien mejor lo cuenta. 💜\n\n#Comunicación #Oratoria #Storytelling #HablarEnPúblico #LiderazgoFemenino #EnVozAlta #FabiolaMurillo", "pdf": "MENSAJE - 5 claves para que tu mensaje se recuerde.pdf", "hist_pid": "sep-25-h"}, {"fecha": "plan-oct-2026-10-13", "mes": "Octubre", "etiqueta": "Martes 13 de octubre", "linea": "Masterclass", "falta": "Día de masterclass: falta editar el reel «Lo que te vas a llevar». Mientras tanto queda este carrusel.", "tipo": "Carrusel", "post_pid": "ago-lunes31", "palabra": "HISTORIA", "texto": "¿Preparaste la presentación con todos los números y aun así la sala se quedó fría? 📊\n\nLos datos informan, pero no mueven. La gente decide con lo que siente y recuerda lo que puede imaginar.\n\nTres claves para hablar con imágenes:\n1️⃣ Cambiá el dato por una escena: «de cada 5 clientas, una se va y no vuelve».\n2️⃣ Contá un mini-caso de 20 segundos: quién, qué pasó y cómo terminó.\n3️⃣ Usá comparaciones: empezá con «es como…» para explicar lo complejo.\n\nNo se trata de dejar los números afuera, sino de darles una historia que los sostenga.\n\nGuardá este post para tu próxima presentación 📌\n\n👉 Comentá HISTORIA y te mando por DM la guía gratis «5 claves para hablar con historias».\n\nNo se recuerda el dato, se recuerda la historia. 💜\n\n#Storytelling #Comunicación #Presentaciones #HablarEnPúblico #LiderazgoFemenino #EnVozAlta #FabiolaMurillo", "pdf": "HISTORIA - 5 claves para hablar con historias.pdf"}, {"fecha": "plan-oct-2026-10-14", "mes": "Octubre", "etiqueta": "Miércoles 14 de octubre", "linea": "Carrusel", "falta": "", "tipo": "Carrusel", "post_pid": "sep-martes08", "palabra": "FRASES", "texto": "«Perdón, solo quería decir algo rapidito…» ¿Te suena? 😬\n\nSabés de lo que hablás, pero hay hábitos que te restan autoridad antes de que llegués al punto: pedir permiso para opinar, rellenar con «este», «o sea», «¿me explico?» y dar mil vueltas antes de decir lo importante.\n\nLa gente no solo escucha lo que decís: siente cómo lo decís. Hacé esto en su lugar:\n✔️ Afirmá, no te disculpes: «Propongo…», «Mi recomendación es…».\n✔️ Cambiá la muletilla por una pausa.\n✔️ Idea primero, contexto después.\n\nEsto también pasa en los equipos: cuando todos hablan así, las reuniones se alargan y las decisiones se atrasan.\n\n👉 Comentá FRASES y te mando por DM la guía gratis «5 claves para dejar de sonar insegura».\n\nNo necesitás hablar más fuerte. Necesitás dejar de pedir perdón por pensar. 💜\n\n#Comunicación #Oratoria #LiderazgoFemenino #MujeresQueLideran #Liderazgo #EnVozAlta #FabiolaMurillo", "pdf": "FRASES - 5 claves para dejar de sonar insegura.pdf", "hist_pid": "sep-08-h"}, {"fecha": "plan-oct-2026-10-15", "mes": "Octubre", "etiqueta": "Jueves 15 de octubre", "linea": "Masterclass", "falta": "", "tipo": "Carrusel", "post_pid": "sep-jueves01oct", "palabra": "COMUNICAR", "texto": "Hiciste el trabajo. Otro se lleva la reunión. 😶\n\nPasa con perfiles muy distintos. Las que no piden la palabra. Las que la piden y nadie las mira. Las de carácter fuerte a las que etiquetan de «intensas». Caminos diferentes, mismo resultado: su aporte no se ve como debería.\n\nHacé que se note:\n1️⃣ Ocupá el espacio o modulá tu fuerza: si te callás, subí tu presencia; si te etiquetan, bajá el tono y dejá que hablen los hechos.\n2️⃣ Cerrá tus ideas con tu nombre: «Como les propuse la semana pasada…».\n3️⃣ Preparate para las reuniones que importan: llevá tu idea en una frase y el dato que la respalda.\n\nVisibilizarte no es competir. Es comunicar.\n\nGuardá este post para tu próxima reunión importante 📌\n\nHoy jueves 15 a las 7:00 p. m. doy una masterclass gratuita de comunicación por Zoom.\n\n👉 Escribí COMUNICAR y te paso el acceso a la masterclass gratuita de hoy.\n\nTu aporte no necesita permiso para ser visto. 💜\n\n#LiderazgoFemenino #MujeresQueLideran #ComunicaciónEfectiva #CrecimientoProfesional #MarcaPersonal #EnVozAlta #FabiolaMurillo", "pdf": null, "hist_pid": "sep-01oct-h"}, {"fecha": "plan-oct-2026-10-16", "mes": "Octubre", "etiqueta": "Viernes 16 de octubre", "linea": "Carrusel", "falta": "", "tipo": "Carrusel", "post_pid": "sep-viernes02oct", "palabra": "VALOR", "texto": "¿Te cuesta hablar de lo que lográs porque sentís que vas a sonar presumida? 🙊\n\nEntonces tu trabajo habla bajito… y otras personas se llevan las oportunidades. Comunicar tu valor no es arrogancia: es darle a la gente la información que necesita para confiar en vos.\n\n3 ejercicios para esta semana:\n1️⃣ Tu frase de valor: «Ayudo a [quién] a [resultado]». Escribila y decila en voz alta 5 veces.\n2️⃣ El caso de la semana: contá un problema real que resolviste (situación, qué hiciste y resultado).\n3️⃣ Aparecé una vez: grabá o escribí algo sobre lo que sabés. La constancia le gana a la perfección.\n\nGuardá este post y empezá hoy con el primero 📌\n\n👉 Comentá VALOR y te mando por DM la guía gratis «5 claves para contar lo que hacés sin sonar presumida».\n\nTu valor no se defiende, se comunica. 💜\n\n#MarcaPersonal #LiderazgoFemenino #MujeresQueLideran #Comunicación #DesarrolloProfesional #EnVozAlta #FabiolaMurillo", "pdf": "VALOR - 5 claves para contar lo que haces sin sonar presumida.pdf", "hist_pid": "sep-02oct-h"}, {"fecha": "plan-oct-2026-10-17", "mes": "Octubre", "etiqueta": "Sábado 17 de octubre", "linea": "VOCES CR", "falta": "", "tipo": "Reel", "titulo": "Un lugar lleno de gente que quiere conocerte", "video": "voces-conocerte", "palabra": "VOCES CR", "texto": "¿Cuándo fue la última vez que estuviste en una sala donde todas las personas querían conocerte? 🤝\n\nA veces trabajamos tanto en lo nuestro que se nos olvida lo más poderoso: conectar con otras personas que también están construyendo algo.\n\nPor eso volvemos. VOCES CR 2026 es el evento anual de IC&SF Costa Rica: una noche de networking y speakers para conversar, conectar y darle voz a tu marca, tu propósito o tu negocio.\n📅 Sábado 7 de noviembre · 5:30 p. m.\n\n👉 Escribí VOCES CR y te paso toda la información, o reservá en fabiolamurillocr.com/voces\n\nUnimos voces. Multiplicamos impacto. 🎤"}, {"fecha": "plan-oct-2026-10-19", "mes": "Octubre", "etiqueta": "Lunes 19 de octubre", "linea": "Carrusel", "falta": "", "tipo": "Carrusel", "post_pid": "sep-lunes07", "palabra": "PRESENCIA", "texto": "¿Tenés la idea clarísima en la cabeza, pero cuando llega tu turno la decís bajito, con rodeos… o no la decís? 🤫\n\nNo te falta capacidad. Te falta método. Comunicar no es un don: se entrena.\n\nTe dejo 3 pasos que te sirven desde hoy:\n1️⃣ Bajá el ritmo: la prisa suena a nervios; la pausa, a autoridad.\n2️⃣ Empezá por la idea, no por el rodeo: primero el QUÉ, después el por qué.\n3️⃣ Sostené la mirada (o la cámara) 2 segundos más de lo que te incomoda. Ahí nace la presencia.\n\nGuardá este post para practicarlo en tu próxima reunión 📌\n\n👉 Comentá PRESENCIA y te mando por DM la guía gratis «5 claves para que no se apague tu voz».\n\nTu voz no tiene que ser más fuerte. Tiene que dejar de apagarse. 💜\n\n#PresenciaEjecutiva #LiderazgoFemenino #Comunicación #MujeresQueLideran #MarcaPersonal #EnVozAlta #FabiolaMurillo", "pdf": "PRESENCIA - 5 claves para que no se apague tu voz.pdf", "hist_pid": "sep-07-h"}, {"fecha": "plan-oct-2026-10-21", "mes": "Octubre", "etiqueta": "Miércoles 21 de octubre", "linea": "Carrusel", "falta": "", "tipo": "Carrusel", "post_pid": "sep-martes15", "palabra": "ESPACIO", "texto": "¿Salís de las reuniones sintiendo que hablaste vos todo el rato… y nadie más aportó? 🗣️\n\nHablar mucho no es comunicar. A veces es tapar. Y no lo hacés con mala intención: interrumpís antes de que terminen la idea, respondés para ganar y no para entender, y sin darte cuenta el equipo deja de animarse.\n\nTu energía no está mal. Se modula. Probá esto esta semana:\n1️⃣ Escuchá para entender, no para contestar.\n2️⃣ Resumí lo que oíste: «Lo que entiendo es…».\n3️⃣ Regla 2x1: por cada afirmación, una pregunta.\n\nGuardá este post para tu próxima reunión de equipo 📌\n\n👉 Comentá ESPACIO y te mando por DM la guía gratis «5 claves para dar espacio sin perder autoridad».\n\nDar espacio no te quita autoridad. Te la multiplica. 💜\n\n#LiderazgoFemenino #Escucha #Comunicación #LiderazgoDeEquipos #MujeresQueLideran #EnVozAlta #FabiolaMurillo", "pdf": "ESPACIO - 5 claves para dar espacio sin perder autoridad.pdf", "hist_pid": "sep-15-h"}, {"fecha": "plan-oct-2026-10-23", "mes": "Octubre", "etiqueta": "Viernes 23 de octubre", "linea": "Carrusel", "falta": "", "tipo": "Post", "post_pid": "ago-jueves13", "palabra": "PERMISO", "texto": "«Perdón, no sé si esto aplica, pero…» ¿Cuántas veces empezás así antes de decir algo que sabés perfectamente? 💭\n\nPedir permiso no siempre se ve como pedir permiso. Se ve como disculparte antes de opinar, esperar a «estar lista», borrar el video antes de publicarlo o bajar tu precio antes de que te lo pidan.\n\nY no tiene que ver con el carácter: le pasa a la que se calla y también a la que habla fuerte, pero después se queda toda la noche pensando si «se pasó».\n\nEl primer paso es darte cuenta de cuándo lo hacés. Por eso armé un test corto para que veas en qué momentos pedís permiso sin notarlo y por dónde empezar a soltarlo.\n\nGuardá este post y hacelo con calma 📌\n\n👉 Comentá PERMISO y te mando por DM el test gratis «¿Cuánto permiso pedís?».\n\nTu lugar ya es tuyo. No pidas permiso para ocuparlo. 💜\n\n#MujerYLiderazgo #LiderazgoFemenino #MujeresQueLideran #Autoconfianza #MarcaPersonal #EnVozAlta #FabiolaMurillo", "pdf": "PERMISO - Test cuanto permiso pedis.pdf", "hist_pid": "ago-jueves13-h"}, {"fecha": "plan-oct-2026-10-24", "mes": "Octubre", "etiqueta": "Sábado 24 de octubre", "linea": "VOCES CR", "falta": "", "tipo": "Reel", "titulo": "Los espacios que vamos a compartir", "video": "voces-espacios", "palabra": "VOCES CR", "texto": "¿Tenés algo que contar y no encontrás dónde? 💭\n\nEn VOCES CR 2026 hay un espacio para cada voz:\n🎤 La tarima: 10 speakers, de 10 a 15 minutos cada uno.\n🏷️ Los stands y las pantallas: para que tu marca se vea.\n🍽️ Las mesas: para cenar y conversar sin prisa.\n💜 La comunidad: la familia IC&SF, que te recibe como en casa.\n\nAccesos: General $50 · Marca $75 · Speaker $100. Marca y Speaker tienen solo 10 cupos cada uno.\n\n📅 Sábado 7 de noviembre · recepción 5:30 p. m. · programa 6:00 p. m.\n\n👉 Escribime VOCES CR (en comentarios o por mensaje) y te mando por chat la información y el enlace para reservar.\n\nTu voz también cuenta. ✨"}, {"fecha": "plan-oct-2026-10-26", "mes": "Octubre", "etiqueta": "Lunes 26 de octubre", "linea": "Carrusel", "falta": "", "tipo": "Carrusel", "post_pid": "sep-lunes14", "palabra": "FIRMEZA", "texto": "¿Te han dicho que sos «muy intensa» cuando hablás, aunque solo querías que las cosas salieran bien? 🔥\n\nTu carácter no es el problema. Es un activo. Pero liderar no es hablar más fuerte: el liderazgo que se respeta escucha, pregunta y elige cuándo hablar.\n\nSi tenés carácter fuerte, modulalo con esto:\n1️⃣ Bajá el volumen, no la convicción: la firmeza no necesita gritar.\n2️⃣ Preguntá antes de afirmar: quien pregunta, dirige la conversación.\n3️⃣ Dejá 3 segundos de silencio para que el otro entre.\n\nGuardá este post para la próxima conversación difícil 📌\n\n👉 Comentá FIRMEZA y te mando por DM la guía gratis «5 claves para liderar sin subir la voz».\n\nTu fuerza no molesta. Se canaliza. 💜\n\n#LiderazgoFemenino #Firmeza #Comunicación #InteligenciaEmocional #MujeresQueLideran #EnVozAlta #FabiolaMurillo", "pdf": "FIRMEZA - 5 claves para liderar sin subir la voz.pdf", "hist_pid": "sep-14-h"}, {"fecha": "plan-oct-2026-10-28", "mes": "Octubre", "etiqueta": "Miércoles 28 de octubre", "linea": "Carrusel", "falta": "", "tipo": "Carrusel", "post_pid": "sep-martes22", "palabra": "ESTRUCTURA", "texto": "Sabés muchísimo de lo tuyo. Pero cuando lo explicás, ves caras perdidas y te toca repetirlo dos veces. ¿Te pasa? 🧩\n\nNo es falta de conocimiento. Es falta de estructura. Lo que más te resta claridad: empezar por el contexto y no por la idea, dar datos sin una historia que los sostenga y querer decirlo todo sin priorizar nada.\n\nHacé esto en su lugar:\n1️⃣ Idea primero, contexto después.\n2️⃣ Un dato + un ejemplo = se recuerda.\n3️⃣ Una sola idea fuerte por mensaje.\n\nGuardá este post antes de tu próxima presentación 📌\n\n👉 Comentá ESTRUCTURA y te mando por DM la guía gratis «5 claves para que te entiendan a la primera».\n\nLa claridad no es un talento. Es una forma de respeto. 💜\n\n#Comunicación #ComunicaciónEfectiva #LiderazgoFemenino #Presentaciones #MujeresQueLideran #EnVozAlta #FabiolaMurillo", "pdf": "ESTRUCTURA - 5 claves para que te entiendan a la primera.pdf", "hist_pid": "sep-22-h"}, {"fecha": "plan-oct-2026-10-30", "mes": "Octubre", "etiqueta": "Viernes 30 de octubre", "linea": "Carrusel", "falta": "", "tipo": "Post", "post_pid": "ago-jueves20", "palabra": "PRESENTACION", "texto": "Te preguntan «¿y vos a qué te dedicás?»… y respondés bajito, con un «nada, yo solo hago…». 😶\n\nEse «solo» te hace pasar desapercibida. En un evento, en una reunión o en una llamada, nadie te va a buscar si no entendió qué hacés.\n\nTu presentación no se improvisa: se prepara. En 30 segundos te alcanza para decir a quién ayudás, qué hacés y qué cambia gracias a tu trabajo. Clara, con seguridad y sin sonar a guion.\n\nEmpezá con esto:\n1️⃣ Borrá el «solo» y el «más o menos» de tu respuesta.\n2️⃣ Decí a quién ayudás antes de decir tu título.\n3️⃣ Terminá con una pregunta que abra la conversación.\n\nGuardá este post para tu próximo evento 📌\n\n👉 Comentá PRESENTACIÓN y te mando por DM la guía gratis «5 claves para presentarte en 30 segundos».\n\nNo naciste para pasar desapercibida. Naciste para que te recuerden. 💜\n\n#MujerYLiderazgo #MarcaPersonal #Networking #LiderazgoFemenino #MujeresQueLideran #EnVozAlta #FabiolaMurillo", "pdf": "PRESENTACION - 5 claves para presentarte en 30 segundos.pdf", "hist_pid": "ago-jueves20-h"}, {"fecha": "plan-oct-2026-10-31", "mes": "Octubre", "etiqueta": "Sábado 31 de octubre", "linea": "VOCES CR", "falta": "", "tipo": "Reel", "titulo": "Lo que vamos a vivir esa noche", "video": "voces-noche", "palabra": "VOCES CR", "texto": "¿Te ha pasado que vas a un evento, escuchás charlas y te vas sin hablar con nadie? 😶\n\nVOCES CR está pensado al revés: para que conversés.\n\n🕠 5:30 p. m. Recepción y networking\n🎤 6:00 p. m. Speakers en la tarima\n🤝 Momentos para conversar entre charlas\n🍽️ Cena con la familia IC&SF\n🏷️ Marcas y emprendimientos con su espacio\n\n📅 Sábado 7 de noviembre · recepción 5:30 p. m. · programa 6:00 p. m.\n\n👉 Escribime VOCES CR (en comentarios o por mensaje) y te mando por chat la información y el enlace para reservar.\n\nNo es una noche para mirar. Es una noche para participar. 🎤"}];

  const txt = d.texto?`<div class="seccion">Texto de la publicación</div><div class="texto corto" id="tx-${d.fecha}">${(d.texto||'').replace(/</g,'&lt;')}</div><button class="vermas" data-tx="${d.fecha}">Ver todo el texto ▾</button>`:'';
  const reel = d.video ? `<p class="titulo">${d.titulo}</p><div class="seccion">Video y portada</div><div class="reel">
    <figure><video controls preload="none" playsinline poster="${VID+d.video}.jpg" src="${VID+d.video}.mp4"></video><figcaption>Reel (vista previa liviana)</figcaption></figure>
    <figure class="galeria" style="overflow:visible;padding:0;display:block"><img loading="lazy" src="${VID+d.video}.jpg" data-full="${VID+d.video}.jpg" alt="Portada"><figcaption>Portada</figcaption></figure></div>${txt}` : '';
  const falta = d.falta ? `<div class="falta">⚠️ ${d.falta}</div>` : '';
  const hist = d.hist_pid ? `<div class="seccion">Historias</div>${galeria(d.hist_pid)}
    ${d.notas_hist?`<div class="texto" style="font-size:14px;color:var(--gris)">${(d.notas_hist||'').replace(/</g,'&lt;')}</div>`:''}`:'';
  const pdf = d.pdf ? `<div class="seccion">Material de apoyo</div><a class="apoyo" href="${PDF+encodeURIComponent(d.pdf)}" target="_blank" rel="noopener">📄 ${d.pdf.replace(/\.pdf$/,'')}</a>`:'';
  return `<section class="dia ${cls}" id="d-${d.fecha}">
    <div class="dhead"><span class="fecha">${d.etiqueta}</span><div class="badges">${badges(d)}</div>${be}</div>
    ${falta}${reel}${post}${hist}${pdf}
    <div class="acc"><div class="fila">
      <button class="btn ap" data-ap="${d.fecha}" aria-pressed="${e.estado==='aprobado'}">✓ Aprobar</button>
      <button class="btn cb" data-cb="${d.fecha}" aria-pressed="${e.estado==='cambios'}">Pedir un cambio</button></div>
      <textarea id="cm-${d.fecha}" placeholder="¿Querés cambiar algo de este día? Escribilo acá.">${e.comentario||''}</textarea>
      <div class="guardar"><button class="btn" data-save="${d.fecha}">Guardar comentario</button><span class="msg" id="mg-${d.fecha}"></span></div>
    </div></section>`;
}
function pintarMes(m){ mesAct=m; [...$('#meses').children].forEach(b=>b.setAttribute('aria-current', b.textContent===m)); $('#lista').innerHTML = DIAS.filter(d=>d.mes===m).map(tarjeta).join(''); }
function progreso(){ const ap=DIAS.filter(d=>(estados[d.fecha]||{}).estado==='aprobado').length; $('#progTxt').textContent=`${ap} de ${DIAS.length} aprobadas`; $('#progFill').style.width=(ap/DIAS.length*100)+'%'; }
$('#meses').innerHTML = meses.map(m=>`<button>${m}</button>`).join(''); [...$('#meses').children].forEach(b=>b.onclick=()=>pintarMes(b.textContent));
const lb=$('#lb');
document.addEventListener('click', e=>{
  const im=e.target.closest('.galeria img'); if(im){ lb.querySelector('img').src=im.dataset.full; lb.classList.add('on'); return; }
  if(e.target.closest('.lightbox')) lb.classList.remove('on');
  const vm=e.target.closest('[data-tx]'); if(vm){ const t=$('#tx-'+vm.dataset.tx); t.classList.remove('corto'); vm.remove(); }
});
async function enviar(fecha, patch){
  estados[fecha]=Object.assign({}, estados[fecha], patch);
  const foco=document.activeElement && document.activeElement.id;
  const nueva=document.createElement('div'); nueva.innerHTML=tarjeta(DIAS.find(d=>d.fecha===fecha));
  $('#d-'+fecha).replaceWith(nueva.firstElementChild);
  if(foco){ const el=document.getElementById(foco); if(el) el.focus(); }
  progreso();
  try{
    const body='data='+encodeURIComponent(JSON.stringify({accion:'guardar', fecha, estado:estados[fecha].estado||null, comentario:estados[fecha].comentario||''}));
    const r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body});
    return r.ok;
  }catch(e){ return false; }
}
function flash(f,msg){ const m=document.getElementById('mg-'+f); if(m){ m.textContent=msg; if(msg) setTimeout(()=>{if(m)m.textContent='';},2600);} }
document.addEventListener('click', async e=>{
  const ap=e.target.closest('[data-ap]'), cb=e.target.closest('[data-cb]'), sv=e.target.closest('[data-save]');
  if(ap){ const f=ap.dataset.ap; const on=(estados[f]||{}).estado==='aprobado'; const ok=await enviar(f,{estado:on?null:'aprobado'}); flash(f, on?'':(ok?'Aprobada ✓':'Guardada (sin conexión, reintentá)')); }
  if(cb){ const f=cb.dataset.cb; await enviar(f,{estado:'cambios'}); const t=document.getElementById('cm-'+f); if(t) t.focus(); }
  if(sv){ const f=sv.dataset.save; const c=document.getElementById('cm-'+f).value.trim(); const ok=await enviar(f,{comentario:c, estado:(estados[f]||{}).estado||(c?'cambios':null)}); flash(f, ok?'Enviado ✓':'No se pudo enviar, reintentá'); }
});
pintarMes(meses[0]); progreso();
(async()=>{
  try{
    const r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(JSON.stringify({accion:'estado'}))});
    const j=await r.json(); const rows=(j&&j.rows)||{};
    Object.keys(rows).forEach(f=>{ estados[f]={estado:rows[f].estado, comentario:rows[f].comentario}; });
    pintarMes(mesAct); progreso();
    const cu=l=>DIAS.filter(d=>d.linea===l).length, fa=DIAS.filter(d=>d.falta).length;
    $('#aviso').innerHTML='<b>Regla de este cronograma:</b> masterclass un día por medio hasta el jueves 15; VOCES CR una vez por semana, los sábados; carruseles ya hechos en los demás días. Después del 15 quedan libres los domingos y algunos martes y jueves.<div class="leyenda"><span><span class="badge m">Masterclass</span> <b>'+cu('Masterclass')+'</b> días</span><span><span class="badge v">VOCES CR</span> <b>'+cu('VOCES CR')+'</b> días</span><span><span class="badge c">Carrusel</span> <b>'+cu('Carrusel')+'</b> días</span><span>⚠️ <b>'+fa+'</b> día con pieza por producir</span></div>';
  }catch(e){ $('#aviso').textContent='No se pudo conectar para cargar el estado. Podés revisar el contenido igual; si aprobás, reintentá con conexión.'; }
})();
</script>
</body>
</html>
