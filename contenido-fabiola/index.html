: "ago-lunes17", "hist_pid": null, "palabra": "POSTURA", "texto": "Antes de decir tu primera palabra, tu cuerpo ya le dijo a la sala si tiene que escucharte. 👀\n\nPodés tener la mejor idea de la reunión, pero si hablás encogida y con la mirada en el papel, la idea pierde fuerza. Y al revés: si sos de carácter fuerte, una postura de «ataque» puede cerrar la conversación antes de empezar.\n\nLa postura de poder no es rigidez ni pose: es estar firme y abierta al mismo tiempo. Te dejo 3 claves en el carrusel:\n1️⃣ Plantá los pies: base firme, voz firme.\n2️⃣ Hombros atrás y abajo: ocupá tu espacio.\n3️⃣ Mirada al frente: sostenela 3 segundos antes de hablar.\n\nGuardá este post y probalo en tu próxima reunión 📌\n\n👉 Comentá POSTURA y te mando por DM la guía gratis «5 claves de postura de poder».\n\nTu cuerpo habla antes que tu voz. Que diga que llegaste para quedarte. 💜\n\n#LenguajeCorporal #Presencia #LiderazgoFemenino #MujeresQueLideran #Comunicación #EnVozAlta #FabiolaMurillo", "notas_hist": "", "pdf": "POSTURA - 5 claves de postura de poder.pdf"}, {"fecha": "2026-09-29", "mes": "Septiembre", "dia": 29, "dsem": "Martes", "etiqueta": "Martes 29 de septiembre", "post_pid": "ago-martes18", "hist_pid": "ago-martes18-h", "palabra": "ENTRENA", "texto": "¿Cuántas veces dijiste «es que yo no sirvo para hablar en público»? 🎤\n\nNadie nace sabiendo exponer, negociar o sostener su precio frente a un cliente. Las que lo hacen con seguridad no tienen un don especial: lo practicaron más veces.\n\nHablar en público se entrena igual que cualquier habilidad: con repeticiones cortas, una cosa a la vez y escuchándote para corregir. Si te cuesta alzar la voz, entrenás presencia. Si hablás rápido y fuerte, entrenás pausa y modulación. Ninguna está mal: cada una entrena lo suyo.\n\nTres pasos para empezar esta semana:\n1️⃣ Elegí UNA cosa para entrenar, no todo a la vez.\n2️⃣ Practicala en voz alta, 5 minutos al día.\n3️⃣ Usala en una situación real y anotá cómo te fue.\n\n👉 Comentá ENTRENA y te mando por DM la guía gratis «5 claves para entrenar tu forma de hablar en público».\n\nTu voz no es un talento que tenés o no tenés. Es un músculo que se entrena. 💜\n\n#HablarEnPúblico #Comunicación #Oratoria #LiderazgoFemenino #Emprendedoras #EnVozAlta #FabiolaMurillo", "notas_hist": "Historia 1 («Cuando decís tu precio, ¿bajás la mirada?»): sticker de encuesta «Sí, me pasa» / «No, lo sostengo».\nHistoria 2 (la historia de Valentina): sticker deslizador de emoji 💸 «¿Cuánto te cuesta decir tu precio?».\nHistoria 3 (lo que cambia): caja de preguntas «¿Qué es lo que más te cuesta a la hora de venderte?».", "pdf": "ENTRENA - 5 claves para entrenar tu forma de hablar en publico.pdf"}, {"fecha": "2026-09-30", "mes": "Septiembre", "dia": 30, "dsem": "Miércoles", "etiqueta": "Miércoles 30 de septiembre", "post_pid": null, "hist_pid": "sep-16-h", "palabra": null, "texto": "", "notas_hist": "", "pdf": null}, {"fecha": "2026-10-01", "mes": "Octubre", "dia": 1, "dsem": "Jueves", "etiqueta": "Jueves 1 de octubre", "post_pid": "sep-jueves17", "hist_pid": "sep-17-h", "palabra": "COMUNICAR", "texto": "¿Te han dicho «mandona», «intensa» o «difícil» por decir lo que pensás? ¿O sos de las que se guardan todo para no incomodar? 💭\n\nA muchas mujeres no las frena el miedo. Las frena el «demasiado»: demasiado fuertes, demasiado calladas, demasiado algo. Y ninguna está mal.\n\nLa autoridad nace en el punto medio, y cada una llega desde un lado distinto:\n1️⃣ Si tu fuerza incomoda: dosificala, no la apagues.\n2️⃣ Si te guardás: una idea dicha vale más que diez pensadas.\n3️⃣ Firmeza + escucha = autoridad.\n\nEl jueves 15 de octubre a las 7:00 p. m. doy una masterclass gratuita de comunicación por Zoom: cómo ordenar tu mensaje, sostener tu voz y lograr que te escuchen, en una reunión, frente a un equipo o frente a la cámara.\n\n👉 Escribí COMUNICAR y te paso el acceso a la masterclass gratuita del jueves 15 de octubre.\n\nNo sos «demasiado». Sos una líder aprendiendo a usar su voz. 💜\n\nEl jueves 15 de octubre a las 7:00 p. m. doy una masterclass gratuita de comunicación por Zoom: cómo ordenar tu mensaje, sostener tu voz y lograr que te escuchen, en una reunión, frente a un equipo o frente a la cámara.", "notas_hist": "Historia 1 («¿Con cuál te identificás más?»): sticker de ENCUESTA «Me guardo todo / Me dicen intensa».\nHistoria 2 («La clave… el punto medio es donde nace tu autoridad»): sticker de DESLIZADOR con emoji ⚖️ («¿Qué tan cerca estás de tu punto medio?»).\nHistoria 3 («Masterclass gratis por Zoom: jueves 15 de octubre. Escribí COMUNICAR»): sticker de CAJA DE PREGUNTAS «Escribí COMUNICAR y te paso el acceso» + sticker de CUENTA REGRESIVA a la masterclass (jueves 15-oct, 7:00 p. m.).", "pdf": null}, {"fecha": "2026-10-02", "mes": "Octubre", "dia": 2, "dsem": "Viernes", "etiqueta": "Viernes 2 de octubre", "post_pid": "sep-viernes18", "hist_pid": "sep-18-h", "palabra": "ESCUCHA", "texto": "¿Alguna vez te diste cuenta de que, mientras la otra persona hablaba, vos ya estabas armando tu respuesta? 🙊\n\nEscuchar no es quedarse callada esperando tu turno. Y cuando no escuchamos, se nota: el equipo deja de proponer, el cliente repite lo mismo y la reunión se alarga. Si sos de carácter fuerte y hablás rápido, esto es para vos. Y si escuchás mucho pero nadie lo nota, también.\n\nTe dejo 3 ejercicios en el carrusel:\n1️⃣ El resumen: «Entonces lo que necesitás es…» antes de responder.\n2️⃣ La pausa de 3: contá hasta 3 cuando el otro termine.\n3️⃣ Una pregunta más: por cada opinión tuya, una pregunta genuina.\n\nGuardalo y probalo en tus próximas 3 conversaciones 📌\n\n👉 Comentá ESCUCHA y te mando por DM la guía gratis «5 claves para escuchar y que se note».\n\nEscuchar no es esperar tu turno. Es el súper poder de quienes lideran. 💜\n\n#Escucha #Comunicación #Liderazgo #LiderazgoFemenino #MujeresQueLideran #EnVozAlta #FabiolaMurillo", "notas_hist": "Historia 1 («¿Resumís lo que te dijeron antes de responder?»): sticker de encuesta «Siempre» / «Casi nunca».\nHistoria 2 (la clave: primero resumo, después opino): sticker deslizador de emoji 👂 «¿Qué tan difícil te parece?».\nHistoria 3 (el súper poder de los que lideran): caja de preguntas «¿Con quién te cuesta más escuchar?».", "pdf": "ESCUCHA - 5 claves para escuchar y que se note.pdf"}, {"fecha": "2026-10-05", "mes": "Octubre", "dia": 5, "dsem": "Lunes", "etiqueta": "Lunes 5 de octubre", "post_pid": "ago-lunes24", "hist_pid": null, "palabra": "PAUSA", "texto": "¿Sentís que tenés que llenar cada segundo para que no piensen que te quedaste en blanco? ⏸️\n\nEse apuro te juega en contra. Cuando hablás sin parar, tu idea se diluye y los nervios se notan más. El silencio, bien usado, es lo que te da autoridad.\n\nTres claves para usarlo desde tu próxima reunión:\n1️⃣ Callá dos segundos después de tu idea más importante.\n2️⃣ Cambiá el «eh, este» por una pausa.\n3️⃣ Pausá un segundo justo antes de la frase clave.\n\nY si sos de las que hablan rápido y con fuerza, la pausa también es para vos: le da espacio a la otra persona y hace que tu idea pese más.\n\nGuardá este post y probalo esta semana 📌\n\n👉 Comentá PAUSA y te mando por DM la guía gratis «5 claves para dominar la pausa».\n\nQuien domina la pausa, domina la sala. 💜\n\n#Comunicación #Oratoria #HablarEnPúblico #LiderazgoFemenino #MujeresQueLideran #EnVozAlta #FabiolaMurillo", "notas_hist": "", "pdf": "PAUSA - 5 claves para dominar la pausa.pdf"}, {"fecha": "2026-10-06", "mes": "Octubre", "dia": 6, "dsem": "Martes", "etiqueta": "Martes 6 de octubre", "post_pid": "ago-martes25", "hist_pid": "ago-martes25-h", "palabra": "PEDIR", "texto": "¿Cuántas veces te quedaste callada esperando que alguien notara todo lo que hacés? 🤐\n\nHacés el trabajo de dos, sostenés al equipo, resolvés lo que nadie ve… y aun así no pedís el aumento, el ascenso o el espacio que te ganaste. Por miedo a parecer «demasiado».\n\nLo que no pedís, no te lo dan. Y pedir no es suerte ni atrevimiento: es comunicar tu valor con claridad.\n✔️ Sabé exactamente qué vas a pedir.\n✔️ Llevá tus resultados, no tus horas extra.\n✔️ Decilo sin disculparte y después callá.\n\nY si lo tuyo es pedir con mucha fuerza, la clave es la misma: claridad y resultados, no presión.\n\n👉 Comentá PEDIR y te mando por DM la guía gratis «5 claves para pedir lo que merecés».\n\nNo estás pidiendo un favor. Estás poniendo sobre la mesa lo que ya construiste. 💜\n\n#LiderazgoFemenino #MujeresQueLideran #DesarrolloProfesional #Negociación #Comunicación #EnVozAlta #FabiolaMurillo", "notas_hist": "Historia 1 («¿Alguna vez NO pediste algo que merecías…?»): sticker de encuesta «Sí, me ha pasado / Todavía no».\nHistoria 2 (Historia real de Sofía): sticker deslizador con emoji 💔 para que reaccionen a la historia.\nHistoria 3 («¿Qué es lo que más te cuesta pedir?»): caja de preguntas «Lo que más me cuesta pedir es…».", "pdf": "PEDIR - 5 claves para pedir lo que mereces.pdf"}, {"fecha": "2026-10-07", "mes": "Octubre", "dia": 7, "dsem": "Miércoles", "etiqueta": "Miércoles 7 de octubre", "post_pid": null, "hist_pid": "sep-23-h", "palabra": null, "texto": "", "notas_hist": "", "pdf": null}, {"fecha": "2026-10-08", "mes": "Octubre", "dia": 8, "dsem": "Jueves", "etiqueta": "Jueves 8 de octubre", "post_pid": "sep-jueves24", "hist_pid": "sep-24-h", "palabra": "COMUNICAR", "texto": "Te felicitan por un logro y lo primero que te sale es: «Ay, tuve suerte». 🍀\n\nNo. Lo hiciste vos.\n\nAlgunas minimizan: «No fue para tanto», «Fue trabajo del equipo». Otras se van al otro extremo y sobre-defienden cada detalle. Son dos caminos distintos que llevan al mismo techo: no comunicar tu valor con naturalidad.\n\nNombrá tu valor así:\n1️⃣ Si minimizás: decí «Lo logré yo», sin disculpas ni «pero».\n2️⃣ Si sobre-defendés: bajá el tono y subí los hechos. Los datos hablan solos.\n3️⃣ Recibí la felicitación con un «Gracias, me costó y me siento orgullosa».\n\nNi disculpa ni defensa: solo la verdad.\n\nGuardá este post para la próxima vez que te feliciten 📌\n\nEl jueves 15 de octubre a las 7:00 p. m. doy una masterclass gratuita de comunicación por Zoom.\n\n👉 Escribí COMUNICAR y te paso el acceso a la masterclass gratuita del jueves 15 de octubre.\n\nTu trabajo no necesita permiso para ser reconocido. 💜\n\n#LiderazgoFemenino #MujeresQueLideran #Autoestima #CrecimientoProfesional #Comunicación #EnVozAlta #FabiolaMurillo", "notas_hist": "Historia 1 (TEST): sticker de encuesta «Cuando te felicitan, ¿qué hacés?» → «Lo minimizo» / «Me defiendo de más».\nHistoria 2 (LA CLAVE): sticker de control deslizante con 💜 «¿Qué tanto te cuesta aceptar un elogio?».\nHistoria 3 (CTA): caja de preguntas «Escribí COMUNICAR y te paso el acceso a la masterclass del 15 de octubre».", "pdf": null}, {"fecha": "2026-10-09", "mes": "Octubre", "dia": 9, "dsem": "Viernes", "etiqueta": "Viernes 9 de octubre", "post_pid": "sep-viernes25", "hist_pid": "sep-25-h", "palabra": "MENSAJE", "texto": "¿Terminás de hablar en una reunión y a los cinco minutos nadie recuerda lo que dijiste? 🧠\n\nNo es que tu idea no valga. Es que llegó envuelta en demasiado contexto y se perdió en el camino.\n\n3 ejercicios de menos de 5 minutos para que tu mensaje se quede:\n1️⃣ La idea en 1 frase: si no cabe en una oración, todavía no la tenés clara.\n2️⃣ El mini-relato: acompañá tu dato con una historia de 20 segundos («a mí me pasó…»).\n3️⃣ Conclusión primero: «La conclusión es X. Ahora te cuento por qué».\n\nElegí uno y practicalo hoy antes de tu próxima conversación importante.\n\nGuardá este post para tenerlo a mano 📌\n\n👉 Comentá MENSAJE y te mando por DM la guía gratis «5 claves para que tu mensaje se recuerde».\n\nNo se recuerda a quien más sabe, sino a quien mejor lo cuenta. 💜\n\n#Comunicación #Oratoria #Storytelling #HablarEnPúblico #LiderazgoFemenino #EnVozAlta #FabiolaMurillo", "notas_hist": "Historia 1 («¿Podés contar lo que hacés en UNA frase?»): sticker de encuesta «Sí, facilito / Me cuesta».\nHistoria 2 (Fórmula «ayudo a X a lograr Y»): sticker deslizador con emoji 💡 «¿Te sirve la fórmula?».\nHistoria 3 (Cierre de Fabiola): caja de preguntas «Escribí tu frase y te doy mi opinión».", "pdf": "MENSAJE - 5 claves para que tu mensaje se recuerde.pdf"}, {"fecha": "2026-10-12", "mes": "Octubre", "dia": 12, "dsem": "Lunes", "etiqueta": "Lunes 12 de octubre", "post_pid": "ago-lunes31", "hist_pid": null, "palabra": "HISTORIA", "texto": "¿Preparaste la presentación con todos los números y aun así la sala se quedó fría? 📊\n\nLos datos informan, pero no mueven. La gente decide con lo que siente y recuerda lo que puede imaginar.\n\nTres claves para hablar con imágenes:\n1️⃣ Cambiá el dato por una escena: «de cada 5 clientas, una se va y no vuelve».\n2️⃣ Contá un mini-caso de 20 segundos: quién, qué pasó y cómo terminó.\n3️⃣ Usá comparaciones: empezá con «es como…» para explicar lo complejo.\n\nNo se trata de dejar los números afuera, sino de darles una historia que los sostenga.\n\nGuardá este post para tu próxima presentación 📌\n\n👉 Comentá HISTORIA y te mando por DM la guía gratis «5 claves para hablar con historias».\n\nNo se recuerda el dato, se recuerda la historia. 💜\n\n#Storytelling #Comunicación #Presentaciones #HablarEnPúblico #LiderazgoFemenino #EnVozAlta #FabiolaMurillo", "notas_hist": "", "pdf": "HISTORIA - 5 claves para hablar con historias.pdf"}, {"fecha": "2026-10-13", "mes": "Octubre", "dia": 13, "dsem": "Martes", "etiqueta": "Martes 13 de octubre", "post_pid": "sep-martes08", "hist_pid": "sep-08-h", "palabra": "FRASES", "texto": "«Perdón, solo quería decir algo rapidito…» ¿Te suena? 😬\n\nSabés de lo que hablás, pero hay hábitos que te restan autoridad antes de que llegués al punto: pedir permiso para opinar, rellenar con «este», «o sea», «¿me explico?» y dar mil vueltas antes de decir lo importante.\n\nLa gente no solo escucha lo que decís: siente cómo lo decís. Hacé esto en su lugar:\n✔️ Afirmá, no te disculpes: «Propongo…», «Mi recomendación es…».\n✔️ Cambiá la muletilla por una pausa.\n✔️ Idea primero, contexto después.\n\nEsto también pasa en los equipos: cuando todos hablan así, las reuniones se alargan y las decisiones se atrasan.\n\n👉 Comentá FRASES y te mando por DM la guía gratis «5 claves para dejar de sonar insegura».\n\nNo necesitás hablar más fuerte. Necesitás dejar de pedir perdón por pensar. 💜\n\n#Comunicación #Oratoria #LiderazgoFemenino #MujeresQueLideran #Liderazgo #EnVozAlta #FabiolaMurillo", "notas_hist": "Historia 1 («¿Cuál muletilla usás más sin darte cuenta?»): sticker de cuestionario con 4 opciones «Este / O sea / ¿Me explico? / Perdón».\nHistoria 2 («En vez de la muletilla, hacé una pausa»): sticker deslizador con emoji 🤐 «¿Lo probás hoy?».\nHistoria 3 («Entreno equipos que comunican con autoridad»): caja de preguntas «¿Qué le cuesta más a tu equipo al comunicar?».", "pdf": "FRASES - 5 claves para dejar de sonar insegura.pdf"}, {"fecha": "2026-10-14", "mes": "Octubre", "dia": 14, "dsem": "Miércoles", "etiqueta": "Miércoles 14 de octubre", "post_pid": null, "hist_pid": "sep-30-h", "palabra": null, "texto": "", "notas_hist": "", "pdf": null}, {"fecha": "2026-10-15", "mes": "Octubre", "dia": 15, "dsem": "Jueves", "etiqueta": "Jueves 15 de octubre", "post_pid": "sep-jueves01oct", "hist_pid": "sep-01oct-h", "palabra": "COMUNICAR", "texto": "Hiciste el trabajo. Otro se lleva la reunión. 😶\n\nPasa con perfiles muy distintos. Las que no piden la palabra. Las que la piden y nadie las mira. Las de carácter fuerte a las que etiquetan de «intensas». Caminos diferentes, mismo resultado: su aporte no se ve como debería.\n\nHacé que se note:\n1️⃣ Ocupá el espacio o modulá tu fuerza: si te callás, subí tu presencia; si te etiquetan, bajá el tono y dejá que hablen los hechos.\n2️⃣ Cerrá tus ideas con tu nombre: «Como les propuse la semana pasada…».\n3️⃣ Preparate para las reuniones que importan: llevá tu idea en una frase y el dato que la respalda.\n\nVisibilizarte no es competir. Es comunicar.\n\nGuardá este post para tu próxima reunión importante 📌\n\nHoy jueves 15 a las 7:00 p. m. doy una masterclass gratuita de comunicación por Zoom.\n\n👉 Escribí COMUNICAR y te paso el acceso a la masterclass gratuita de hoy.\n\nTu aporte no necesita permiso para ser visto. 💜\n\n#LiderazgoFemenino #MujeresQueLideran #ComunicaciónEfectiva #CrecimientoProfesional #MarcaPersonal #EnVozAlta #FabiolaMurillo", "notas_hist": "Historia 1 (TEST): sticker de encuesta «¿Tu aporte se nota lo que debería en tu trabajo?» → «Sí» / «No tanto».\nHistoria 2 (LA CLAVE): sticker de control deslizante 💜 «¿Qué tanto te cuesta hacerte visible?».\nHistoria 3 (CTA): caja de preguntas «Escribí COMUNICAR y te paso el acceso a la masterclass del 15 de octubre».", "pdf": null}, {"fecha": "2026-10-16", "mes": "Octubre", "dia": 16, "dsem": "Viernes", "etiqueta": "Viernes 16 de octubre", "post_pid": "sep-viernes02oct", "hist_pid": "sep-02oct-h", "palabra": "VALOR", "texto": "¿Te cuesta hablar de lo que lográs porque sentís que vas a sonar presumida? 🙊\n\nEntonces tu trabajo habla bajito… y otras personas se llevan las oportunidades. Comunicar tu valor no es arrogancia: es darle a la gente la información que necesita para confiar en vos.\n\n3 ejercicios para esta semana:\n1️⃣ Tu frase de valor: «Ayudo a [quién] a [resultado]». Escribila y decila en voz alta 5 veces.\n2️⃣ El caso de la semana: contá un problema real que resolviste (situación, qué hiciste y resultado).\n3️⃣ Aparecé una vez: grabá o escribí algo sobre lo que sabés. La constancia le gana a la perfección.\n\nGuardá este post y empezá hoy con el primero 📌\n\n👉 Comentá VALOR y te mando por DM la guía gratis «5 claves para contar lo que hacés sin sonar presumida».\n\nTu valor no se defiende, se comunica. 💜\n\n#MarcaPersonal #LiderazgoFemenino #MujeresQueLideran #Comunicación #DesarrolloProfesional #EnVozAlta #FabiolaMurillo", "notas_hist": "Historia 1 («¿Te animás a publicar tu frase de valor esta semana?»): sticker de encuesta «¡Me animo! / Todavía no».\nHistoria 2 («No tiene que ser perfecta, tiene que existir»): sticker deslizador con emoji 🔥.\nHistoria 3 (Cierre de Fabiola): caja de preguntas «Escribí tu frase de valor y te la reviso».", "pdf": "VALOR - 5 claves para contar lo que haces sin sonar presumida.pdf"}, {"fecha": "2026-10-19", "mes": "Octubre", "dia": 19, "dsem": "Lunes", "etiqueta": "Lunes 19 de octubre", "post_pid": "sep-lunes07", "hist_pid": "sep-07-h", "palabra": "PRESENCIA", "texto": "¿Tenés la idea clarísima en la cabeza, pero cuando llega tu turno la decís bajito, con rodeos… o no la decís? 🤫\n\nNo te falta capacidad. Te falta método. Comunicar no es un don: se entrena.\n\nTe dejo 3 pasos que te sirven desde hoy:\n1️⃣ Bajá el ritmo: la prisa suena a nervios; la pausa, a autoridad.\n2️⃣ Empezá por la idea, no por el rodeo: primero el QUÉ, después el por qué.\n3️⃣ Sostené la mirada (o la cámara) 2 segundos más de lo que te incomoda. Ahí nace la presencia.\n\nGuardá este post para practicarlo en tu próxima reunión 📌\n\n👉 Comentá PRESENCIA y te mando por DM la guía gratis «5 claves para que no se apague tu voz».\n\nTu voz no tiene que ser más fuerte. Tiene que dejar de apagarse. 💜\n\n#PresenciaEjecutiva #LiderazgoFemenino #Comunicación #MujeresQueLideran #MarcaPersonal #EnVozAlta #FabiolaMurillo", "notas_hist": "Historia 1 («¿Tenés la idea pero no te animás a decirla?»): sticker de ENCUESTA «Sí, me pasa / No, la digo».\nHistoria 2 («La clave… decí tu idea en una sola frase»): sticker de DESLIZADOR con emoji 💬 («¿Qué tanto te cuesta?»).\nHistoria 3 («¿Querés dejar de guardarte lo que pensás?»): sticker de CAJA DE PREGUNTAS «¿Qué idea te guardaste esta semana?» + mención «Comentá PRESENCIA en el último post».", "pdf": "PRESENCIA - 5 claves para que no se apague tu voz.pdf"}, {"fecha": "2026-10-20", "mes": "Octubre", "dia": 20, "dsem": "Martes", "etiqueta": "Martes 20 de octubre", "post_pid": "sep-martes15", "hist_pid": "sep-15-h", "palabra": "ESPACIO", "texto": "¿Salís de las reuniones sintiendo que hablaste vos todo el rato… y nadie más aportó? 🗣️\n\nHablar mucho no es comunicar. A veces es tapar. Y no lo hacés con mala intención: interrumpís antes de que terminen la idea, respondés para ganar y no para entender, y sin darte cuenta el equipo deja de animarse.\n\nTu energía no está mal. Se modula. Probá esto esta semana:\n1️⃣ Escuchá para entender, no para contestar.\n2️⃣ Resumí lo que oíste: «Lo que entiendo es…».\n3️⃣ Regla 2x1: por cada afirmación, una pregunta.\n\nGuardá este post para tu próxima reunión de equipo 📌\n\n👉 Comentá ESPACIO y te mando por DM la guía gratis «5 claves para dar espacio sin perder autoridad».\n\nDar espacio no te quita autoridad. Te la multiplica. 💜\n\n#LiderazgoFemenino #Escucha #Comunicación #LiderazgoDeEquipos #MujeresQueLideran #EnVozAlta #FabiolaMurillo", "notas_hist": "Historia 1 («En una reunión, ¿escuchás o esperás tu turno?»): sticker de ENCUESTA «Escucho / Espero mi turno».\nHistoria 2 («La clave… repetí lo que escuchaste»): sticker de QUIZ «¿Qué frase abre la conversación?» con opciones «Lo que entiendo es… / Sí, pero… / Ya sé».\nHistoria 3 («Los mejores líderes son los que mejor escuchan»): sticker de CAJA DE PREGUNTAS «¿Qué te cuesta más al escuchar?» + mención «Comentá ESPACIO en el último post».", "pdf": "ESPACIO - 5 claves para dar espacio sin perder autoridad.pdf"}, {"fecha": "2026-10-22", "mes": "Octubre", "dia": 22, "dsem": "Jueves", "etiqueta": "Jueves 22 de octubre", "post_pid": "ago-jueves13", "hist_pid": "ago-jueves13-h", "palabra": "PERMISO", "texto": "«Perdón, no sé si esto aplica, pero…» ¿Cuántas veces empezás así antes de decir algo que sabés perfectamente? 💭\n\nPedir permiso no siempre se ve como pedir permiso. Se ve como disculparte antes de opinar, esperar a «estar lista», borrar el video antes de publicarlo o bajar tu precio antes de que te lo pidan.\n\nY no tiene que ver con el carácter: le pasa a la que se calla y también a la que habla fuerte, pero después se queda toda la noche pensando si «se pasó».\n\nEl primer paso es darte cuenta de cuándo lo hacés. Por eso armé un test cor n opciones «Quien pregunta / Quien habla más fuerte».\nHistoria 3 («Tu carácter es un activo: aprendé a dosificarlo»): sticker de CAJA DE PREGUNTAS «¿En qué momento se te sube el tono?» + mención «Comentá FIRMEZA en el último post».", "pdf": "FIRMEZA - 5 claves para liderar sin subir la voz.pdf"}, {"fecha": "2026-10-27", "mes": "Octubre", "dia": 27, "dsem": "Martes", "etiqueta": "Martes 27 de octubre", "post_pid": "sep-martes22", "hist_pid": "sep-22-h", "palabra": "ESTRUCTURA", "texto": "Sabés muchísimo de lo tuyo. Pero cuando lo explicás, ves caras perdidas y te toca repetirlo dos veces. ¿Te pasa? 🧩\n\nNo es falta de conocimiento. Es falta de estructura. Lo que más te resta claridad: empezar por el contexto y no por la idea, dar datos sin una historia que los sostenga y querer decirlo todo sin priorizar nada.\n\nHacé esto en su lugar:\n1️⃣ Idea primero, contexto después.\n2️⃣ Un dato + un ejemplo = se recuerda.\n3️⃣ Una sola idea fuerte por mensaje.\n\nGuardá este post antes de tu próxima presentación 📌\n\n👉 Comentá ESTRUCTURA y te mando por DM la guía gratis «5 claves para que te entiendan a la primera».\n\nLa claridad no es un talento. Es una forma de respeto. 💜\n\n#Comunicación #ComunicaciónEfectiva #LiderazgoFemenino #Presentaciones #MujeresQueLideran #EnVozAlta #FabiolaMurillo", "notas_hist": "Historia 1 («Cuando explicás algo, ¿entienden a la primera?»): sticker de ENCUESTA «Sí, a la primera / Me toca repetir».\nHistoria 2 («La clave… decí la conclusión antes del contexto»): sticker de QUIZ «¿Con qué empezás?» con opciones «La conclusión / El contexto / Los datos».\nHistoria 3 («Te ayudo a que te entiendan a la primera»): sticker de CAJA DE PREGUNTAS «¿Qué te cuesta explicar?» + mención «Comentá ESTRUCTURA en el último post».", "pdf": "ESTRUCTURA - 5 claves para que te entiendan a la primera.pdf"}, {"fecha": "2026-10-29", "mes": "Octubre", "dia": 29, "dsem": "Jueves", "etiqueta": "Jueves 29 de octubre", "post_pid": "ago-jueves20", "hist_pid": "ago-jueves20-h" st del lider que se escucha.pdf"}, {"fecha": "2026-11-09", "mes": "Noviembre", "dia": 9, "dsem": "Lunes", "etiqueta": "Lunes 9 de noviembre", "post_pid": "sep-lunes28", "hist_pid": "sep-28-h", "palabra": "MARCA", "texto": "Tu marca habla, aunque vos calles. 🔊\n\nPodés ser la mejor en lo tuyo, pero si nadie lo sabe, para el mercado no existe. Y comunicar tu valor no es presumir: es abrir puertas.\n\nTe dejo 3 pasos para que te conozcan por lo que sabés:\n1️⃣ Definí en una frase qué problema resolvés y para quién.\n2️⃣ Contá lo que hacés, no solo lo que ofrecés: mostrá el detrás, el proceso, un caso real que resolviste.\n3️⃣ Aparecé con constancia: la confianza se construye a repetición.\n\nSi te da pena mostrarte, no se trata de hablar de vos todo el día. Se trata de que tu trabajo tenga voz.\n\nVisibilidad no es ego. Es estrategia.\n\nGuardá este post para armar tu frase esta semana 📌\n\n👉 Comentá MARCA y te mando por DM la guía gratis «5 claves para que te conozcan por lo que sabés».\n\nLo que sabés no necesita permiso para ser visto. 💜\n\n#MarcaPersonal #LiderazgoFemenino #MujeresQueLideran #Emprendedoras #ComunicaciónEfectiva #EnVozAlta #FabiolaMurillo", "notas_hist": "Historia 1 (TEST): sticker de encuesta «¿La gente sabe realmente a qué te dedicás?» → «Sí, clarísimo» / «Creo que no».\nHistoria 2 (LA CLAVE): caja de preguntas corta «Contame un caso real que resolviste» o sticker de control deslizante 🔊.\nHistoria 3 (CTA): caja de preguntas «¿Qué te frena a mostrar lo que sabés?» + recordatorio de comentar MARCA en el post.", "pdf": "MARCA - 5 claves para que te conozcan por lo que sabes.pdf"}];

function imgsDe(pid){ const n = COUNTS[pid] || 0; const a = []; for (let i=1;i<=n;i++) a.push(IMG + pid + '-' + i + '.jpg'); return a; }
function badges(d){
  const b = [];
  if (d.post_pid){ const n = COUNTS[d.post_pid]||0; b.push(`<span class="badge">${n>1?'Carrusel · '+n+' imágenes':'Post'}</span>`); }

function galeria(pid){ return `<div class="galeria">${imgsDe(pid).map(u=>`<img loading="lazy" src="${u}" alt="" data-full="${u}">`).join('')}</div>`; }
function tarjeta(d){
  const e = estados[d.fecha] || {};
  const cls = e.estado==='aprobado'?'aprobado':e.estado==='cambios'?'cambios':'';
  const be = e.estado==='aprobado'?'<span class="estado ok">✓ Aprobada</span>':e.estado==='cambios'?'<span class="estado amb">Pidió cambios</span>':'<span class="estado">Pendiente</span>';

    ${d.texto?`<div class="seccion">Texto de la publicación</div><div class="texto corto" id="tx-${d.fecha}">${(d.texto||'').replace(/</g,'&lt;')}</div><button class="vermas" data-tx="${d.fecha}">Ver todo el texto ▾</button>`:''}`:'';

  const pdf = d.pdf ? `<div class="seccion">Material de apoyo</div><a class="apoyo" href="${PDF+encodeURIComponent(d.pdf)}" target="_blank" rel="noopener">📄 ${d.pdf.replace(/\.pdf$/,'')}</a>`:'';
  return `<section class="dia ${cls}" id="d-${d.fecha}">
    <div class="dhead"><span class="fecha">${d.etiqueta}</span><div class="badges">${badges(d)}</div>${be}</div>

      <div class="guardar"><button class="btn" data-save="${d.fecha}">Guardar comentario</button><span class="msg" id="mg-${d.fecha}"></span></div>
    </div></section>`;
}

});
async function enviar(fecha, patch){
  estados[fecha]=Object.assign({}, estados[fecha], patch);
  const foco=document.activeElement && document.activeElement.id;
  const nueva=document.createElement('div'); nueva.innerHTML=tarjeta(DIAS.find(d=>d.fecha===fecha));
  $('#d-'+fecha).replaceWith(nueva.firstElementChild);
  if(foco){ const el=document.getElementById(foco); if(el) el.focus(); }
  progreso();
  try{
    const body='data='+encodeURIComponent(JSON.stringify({accion:'guardar', fecha, estado:estados[fecha].estado||null, comentario:estados[fecha].comentario||''}));
    const r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body});
    return r.ok;
  }catch(e){ return false; }
}
function flash(f,msg){ const m=document.getElementById('mg-'+f); if(m){ m.textContent=msg; if(msg) setTimeout(()=>{if(m)m.textContent='';},2600);} }
document.addEventListener('click', async e=>{
  const ap=e.target.closest('[data-ap]'), cb=e.target.closest('[data-cb]'), sv=e.target.closest('[data-save]');
  if(ap){ const f=ap.dataset.ap; const on=(estados[f]||{}).estado==='aprobado'; const ok=await enviar(f,{estado:on?null:'aprobado'}); flash(f, on?'':(ok?'¡Aprobada! Gracias 💜':'Guardada (sin conexión, reintentá)')); }
  if(cb){ const f=cb.dataset.cb; await enviar(f,{estado:'cambios'}); const t=document.getElementById('cm-'+f); if(t) t.focus(); }
  if(sv){ const f=sv.dataset.save; const c=document.getElementById('cm-'+f).value.trim(); const ok=await enviar(f,{comentario:c, estado:(estados[f]||{}).estado||(c?'cambios':null)}); flash(f, ok?'Enviado ✓':'No se pudo enviar, reintentá'); }
});
pintarMes(meses[0]); progreso();
(async()=>{
  try{
    const r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(JSON.stringify({accion:'estado'}))});
    const j=await r.json(); const rows=(j&&j.rows)||{};
    Object.keys(rows).forEach(f=>{ estados[f]={estado:rows[f].estado, comentario:rows[f].comentario}; });
    pintarMes(mesAct); progreso();
    $('#aviso').innerHTML='Tocá <b>Aprobar</b> en cada publicación, o escribí un cambio y <b>Guardar</b>. Todo le llega a UNONUEVE al instante.';
  }catch(e){ $('#aviso').textContent='No se pudo conectar para cargar el estado. Podés revisar el contenido igual; si aprobás, reintentá con conexión.'; }
})();
</script>
