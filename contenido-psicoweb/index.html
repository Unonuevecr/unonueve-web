const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const estados = {};
const FILTROS = [["todas","Todas"],["carrusel","Carruseles e imágenes"],["reel","Reels y videos"],["pend","Pendientes"],["cambios","Con cambios"]];
let filtro = "todas";

function historias(t){
  if(!t) return '';
  const partes = t.split(/\n?\s*(?=\d\)\s)/).map(s=>s.trim()).filter(s=>/^\d\)/.test(s));
  if(!partes.length) return `<div class="texto">${esc(t)}</div>`;
  return `<ul class="hist">${partes.map(p=>{ const m=p.match(/^(\d)\)\s*([A-ZÁÉÍÓÚÑ ]+?)\s*·\s*([\s\S]*)$/); return m?`<li><b>${m[1]} · ${esc(m[2])}</b>${esc(m[3])}</li>`:`<li>${esc(p)}</li>`; }).join('')}</ul>`;
}
function guion(g){
  if(!g) return '';
  return `<div class="seccion">Guion del video (lo graba Rebe)</div><details><summary>Video nº ${g.num} · «${esc(g.titulo)}»${g.duracion?' · '+esc(g.duracion):''}</summary><div class="gb">
    ${g.rotulo&&g.rotulo.length?`<h4>Texto en pantalla</h4><div class="rotulo">${g.rotulo.map(esc).join(' ')}</div>`:''}
    <h4>Lo que dice</h4><div>${esc(g.guion)}</div>
    ${g.cierre?`<h4>Cierre</h4><div>${esc(g.cierre)}</div>`:''}
    ${g.nota?`<h4>Nota de producción</h4><div style="color:var(--gris)">${esc(g.nota)}</div>`:''}</div></details>`;
}
function tarjeta(d){
  const e = estados[d.fecha] || {};
  const cls = e.estado==='aprobado'?'aprobado':e.estado==='cambios'?'cambios':'';
  const be = e.estado==='aprobado'?'<span class="estado ok">✓ Aprobada</span>':e.estado==='cambios'?'<span class="estado amb">Pidió cambios</span>':'<span class="estado">Pendiente</span>';
  const b = [`<span class="badge">${esc(d.tipo)}</span>`];
  if(d.guion && !d.video) b.push('<span class="badge p">Video por grabar</span>');
  if(d.historias) b.push('<span class="badge g">Historias</span>');
  let pieza = '';
  if(d.imgs.length){
    pieza = `<div class="seccion">${d.imgs.length>1?'Carrusel':'Imagen'}</div><div class="galeria">${d.imgs.map(u=>`<img loading="lazy" src="${u}" alt="Lámina de la publicación" data-full="${u}">`).join('')}</div>`;
  } else if(d.video || d.portada || d.guion){
    const med = d.video ? `<video controls playsinline preload="none" ${d.portada?`poster="${d.portada}"`:''} src="${d.video}"></video>`
              : d.portada ? `<img src="${d.portada}" alt="Portada del reel" data-full="${d.portada}">` : '';
    const nota = d.video ? '' : `<div class="nota">${d.portada?'Esta es la portada del reel.':'La portada de este reel está en preparación.'} El video lo graba Rebe con el guion de abajo; cuando esté editado, aparece aquí.</div>`;
    pieza = `<div class="seccion">Reel</div><div class="reel">${med}${nota}</div>`;
  }
  const texto = d.texto ? `<div class="seccion">Texto de la publicación</div><div class="texto corto" id="tx-${d.fecha}">${esc(d.texto)}</div><button class="vermas" data-tx="${d.fecha}">Ver todo el texto ▾</button>` : '';
  const hist = d.historias ? `<div class="seccion">Historias del día</div>${historias(d.historias.replace(/^HISTORIAS[^\n]*\n?/,''))}` : '';
  return `<section class="dia ${cls}" id="d-${d.fecha}">
    <div class="dhead"><span class="fecha">${esc(d.etiqueta)}</span><div class="badges">${b.join('')}</div>${be}</div>
    ${pieza}${texto}${guion(d.guion)}${hist}
    <div class="acc"><div class="fila">
      <button class="btn ap" data-ap="${d.fecha}" aria-pressed="${e.estado==='aprobado'}">✓ Aprobar</button>
      <button class="btn cb" data-cb="${d.fecha}" aria-pressed="${e.estado==='cambios'}">Pedir un cambio</button></div>
      <textarea id="cm-${d.fecha}" aria-label="Comentario" placeholder="¿Quiere cambiar algo? Escríbalo aquí y le llega a UNONUEVE.">${esc(e.comentario||'')}</textarea>
      <div class="guardar"><button class="btn" data-save="${d.fecha}">Guardar comentario</button><span class="msg" id="mg-${d.fecha}"></span></div>
    </div></section>`;
}
function pasa(d){
  const e=(estados[d.fecha]||{}).estado;
  if(filtro==='carrusel') return d.imgs.length>0;
  if(filtro==='reel') return !d.imgs.length;
  if(filtro==='pend') return !e;
  if(filtro==='cambios') return e==='cambios';
  return true;
}
function pintar(){ const L=DIAS.filter(pasa); $('#lista').innerHTML = L.length?L.map(tarjeta).join(''):'<p class="sub">No hay publicaciones con este filtro.</p>'; }
function progreso(){ const ap=DIAS.filter(d=>(estados[d.fecha]||{}).estado==='aprobado').length; $('#progTxt').textContent=`${ap} de ${DIAS.length} aprobadas`; $('#progFill').style.width=(ap/DIAS.length*100)+'%'; }
$('#filtros').innerHTML = FILTROS.map(([k,t])=>`<button data-f="${k}" aria-pressed="${k===filtro}">${t}</button>`).join('');
const lb=$('#lb');
document.addEventListener('click', e=>{
  const fb=e.target.closest('[data-f]'); if(fb){ filtro=fb.dataset.f; [...$('#filtros').children].forEach(b=>b.setAttribute('aria-pressed', b.dataset.f===filtro)); pintar(); return; }
  const im=e.target.closest('.galeria img, .reel img'); if(im){ lb.querySelector('img').src=im.dataset.full; lb.classList.add('on'); return; }
  if(e.target.closest('.lightbox')) lb.classList.remove('on');
  const vm=e.target.closest('[data-tx]'); if(vm){ const t=$('#tx-'+vm.dataset.tx); t.classList.remove('corto'); vm.remove(); }
});
async function enviar(fecha, patch){
  estados[fecha]=Object.assign({}, estados[fecha], patch);
  const foco=document.activeElement && document.activeElement.id;
  const vieja=$('#d-'+fecha);
  if(vieja){ const n=document.createElement('div'); n.innerHTML=tarjeta(DIAS.find(d=>d.fecha===fecha)); vieja.replaceWith(n.firstElementChild); }
  if(foco){ const el=document.getElementById(foco); if(el) el.focus(); }
  progreso();
  try{
    const body='data='+encodeURIComponent(JSON.stringify({accion:'guardar', fecha, estado:estados[fecha].estado||null, comentario:estados[fecha].comentario||''}));
    const r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body});
    return r.ok;
  }catch(e){ return false; }
}
function flash(f,msg){ const m=document.getElementById('mg-'+f); if(m){ m.textContent=msg; if(msg) setTimeout(()=>{if(m)m.textContent='';},2600);} }
document.addEventListener('click', async e=>{
  const ap=e.target.closest('[data-ap]'), cb=e.target.closest('[data-cb]'), sv=e.target.closest('[data-save]');
  if(ap){ const f=ap.dataset.ap; const on=(estados[f]||{}).estado==='aprobado'; const ok=await enviar(f,{estado:on?null:'aprobado'}); flash(f, on?'':(ok?'¡Aprobada! Muchas gracias':'Se guardó aquí, pero no hubo conexión: vuelva a intentar')); }
  if(cb){ const f=cb.dataset.cb; await enviar(f,{estado:'cambios'}); const t=document.getElementById('cm-'+f); if(t) t.focus(); }
  if(sv){ const f=sv.dataset.save; const c=document.getElementById('cm-'+f).value.trim(); const ok=await enviar(f,{comentario:c, estado:(estados[f]||{}).estado||(c?'cambios':null)}); flash(f, ok?'Enviado ✓':'No se pudo enviar, vuelva a intentar'); }
});
pintar(); progreso();
(async()=>{
  try{
    const r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(JSON.stringify({accion:'estado'}))});
    const j=await r.json(); const rows=(j&&j.rows)||{};
    Object.keys(rows).forEach(f=>{ estados[f]={estado:rows[f].estado, comentario:rows[f].comentario}; });
    pintar(); progreso();
    $('#aviso').innerHTML='Toque <b>Aprobar</b> en cada publicación, o escriba el cambio y toque <b>Guardar comentario</b>. Todo le llega a UNONUEVE al instante.';
  }catch(e){ $('#aviso').textContent='No se pudo conectar para cargar lo ya aprobado. Puede revisar el contenido igual; si aprueba, vuelva a intentar con conexión.'; }
})();
</script>
