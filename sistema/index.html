<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema Transtour</title>
<style>
:root{--fondo:#F4F6F8;--panel:#fff;--tinta:#12202B;--suave:#5A6B7A;--tenue:#93A2AF;
--linea:#DFE5EA;--marca:#123B5E;--marca2:#1E6FA8;--ok:#1F7A4D;--okf:#E6F2EB;
--alerta:#B0451C;--alertaf:#FBEDE7;--aviso:#8A6A12;--avisof:#FBF3DC;
--f:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--fondo);color:var(--tinta);font-size:14px;line-height:1.5}
button,input,select{font-family:inherit;font-size:14px}
.oculto{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.caja{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(18,32,43,.06)}
.caja h1{font-size:19px;letter-spacing:-.01em;margin-bottom:4px}
.caja p{color:var(--suave);font-size:13px;margin-bottom:24px}
label{display:block;font-size:12px;font-weight:600;color:var(--suave);margin:14px 0 6px;letter-spacing:.02em}
input[type=text],input[type=password],input[type=number],input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:8px;background:#fff;color:var(--tinta)}
input:focus{outline:2px solid var(--marca2);outline-offset:-1px;border-color:transparent}
.btn{background:var(--marca);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:600;cursor:pointer;width:100%;margin-top:22px}
.btn:hover{background:var(--marca2)}
.btn.chico{width:auto;margin:0;padding:7px 14px;font-size:13px}
.btn.gris{background:#fff;color:var(--tinta);border:1px solid var(--linea)}
.err{background:var(--alertaf);color:var(--alerta);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:16px}
/* app */
#app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
aside{background:var(--marca);color:#fff;padding:20px 12px;display:flex;flex-direction:column;gap:3px}
.logo{font-weight:700;font-size:15px;padding:6px 12px 18px;letter-spacing:-.01em}
.logo small{display:block;font-weight:400;font-size:11px;opacity:.6;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
nav button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:#C7D7E4;padding:9px 12px;border-radius:8px;cursor:pointer;text-align:left;font-size:13.5px}
nav button:hover{background:rgba(255,255,255,.08);color:#fff}
nav button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
nav button .pill{margin-left:auto;font-size:10px;background:rgba(255,255,255,.16);padding:2px 6px;border-radius:20px;letter-spacing:.04em}
.pie{margin-top:auto;padding:12px;font-size:12px;color:#9FB6C9;border-top:1px solid rgba(255,255,255,.12)}
.pie b{display:block;color:#fff;font-size:13px}
.pie a{color:#9FB6C9;text-decoration:underline;cursor:pointer;font-size:12px}
main{padding:26px 30px 60px;overflow:auto}
h2{font-size:20px;letter-spacing:-.01em}
.sub{color:var(--suave);font-size:13px;margin-top:3px}
.barra{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 16px}
.barra input[type=search]{max-width:320px}
.tarj{background:var(--panel);border:1px solid var(--linea);border-radius:12px;overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--tenue);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tenue);padding:11px 14px;background:#FAFBFC;border-bottom:1px solid var(--linea);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--linea);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFBFC}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.c-ok{background:var(--okf);color:var(--ok)} .c-al{background:var(--alertaf);color:var(--alerta)}
.c-av{background:var(--avisof);color:var(--aviso)} .c-gr{background:#EEF1F4;color:var(--suave)}
.link{color:var(--marca2);cursor:pointer;text-decoration:none;font-weight:500}
.link:hover{text-decoration:underline}
.vacio{padding:40px;text-align:center;color:var(--tenue)}
.pronto{background:var(--panel);border:1px dashed var(--linea);border-radius:12px;padding:44px 30px;text-align:center;color:var(--suave)}
.pronto b{display:block;color:var(--tinta);font-size:16px;margin-bottom:8px}
.pronto ul{list-style:none;margin-top:18px;display:inline-block;text-align:left}
.pronto li{padding:5px 0 5px 20px;position:relative;font-size:13.5px}
.pronto li:before{content:"›";position:absolute;left:4px;color:var(--marca2);font-weight:700}
.scroll{overflow-x:auto}
dialog{border:0;border-radius:14px;padding:0;max-width:420px;width:92%;box-shadow:0 12px 48px rgba(18,32,43,.24)}
dialog::backdrop{background:rgba(18,32,43,.45)}
.dlg{padding:26px 28px}
.dlg h3{font-size:17px;margin-bottom:3px}
.dlg .fila{display:flex;gap:10px;margin-top:22px}
.dlg .fila .btn{margin:0}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;padding:12px}.logo{width:100%;padding-bottom:10px}nav{display:flex;gap:4px;flex-wrap:wrap;width:100%}nav button{width:auto}.pie{width:100%;margin-top:10px}main{padding:18px 16px 50px}}
</style></head><body>

<section id="login"><form class="caja" id="fLogin">
  <h1>Sistema Transtour</h1><p>Ingresá con tu usuario para continuar.</p>
  <label for="u">Usuario</label><input id="u" type="text" autocomplete="username" required>
  <label for="p">Clave</label><input id="p" type="password" autocomplete="current-password" required>
  <button class="btn" type="submit">Entrar</button>
  <div id="eLogin" class="err oculto"></div>
</form></section>

<section id="app" class="oculto">
  <aside>
    <div class="logo">Transtour<small>Sistema interno</small></div>
    <nav>
      <button data-m="clientes" class="on">👥 Clientes</button>
      <button data-m="cobros">💰 Cobros</button>
      <button data-m="retargeting">🎯 Retargeting</button>
      <button data-m="bot">🤖 Bot</button>
      <button data-m="tareas">✅ Tareas</button>
      <button data-m="citas">📅 Citas</button>
    </nav>
    <div class="pie"><b id="quien">—</b><span id="rol"></span><br><a id="salir">Cerrar sesión</a></div>
  </aside>
  <main id="vista"></main>
</section>

<dialog id="dAbono"><form class="dlg" method="dialog" id="fAbono">
  <h3>Registrar abono</h3><p class="sub" id="aPax"></p>
  <label>Costo del tour</label><input id="aCosto" type="number" step="0.01" readonly>
  <label>Abono total recibido</label><input id="aMonto" type="number" step="0.01" required autofocus>
  <p class="sub" style="margin-top:8px">Queda registrado a tu nombre con la fecha y la hora.</p>
  <div class="fila"><button class="btn gris" value="cancel" type="submit">Cancelar</button>
  <button class="btn" id="aGuardar" value="ok" type="submit">Guardar</button></div>
</form></dialog>

<script>
// El sistema puede vivir en cualquier dominio: la API siempre es la de n8n de Transtour.
const API = 'https://transtourcr-n8n.i1bsw7.easypanel.host/webhook/';
let S = { token:'', usuario:'', nombre:'', rol:'', modulo:'clientes', salida:null, pax:[] };
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plata = n => '$' + (Number(n)||0).toLocaleString('es-CR',{maximumFractionDigits:0});

async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function api(ruta,datos){
  const r = await fetch(API+ruta,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({token:S.token},datos||{}))});
  return r.json();
}

$('#fLogin').addEventListener('submit', async e=>{
  e.preventDefault(); const b=e.target.querySelector('button'); b.textContent='Entrando…'; b.disabled=true;
  try{
    const d = await api('sistema-login',{usuario:$('#u').value.trim(), clave_hash: await sha256($('#p').value)});
    if(!d.ok){ $('#eLogin').textContent=d.error||'No se pudo entrar'; $('#eLogin').classList.remove('oculto'); return; }
    S.token=d.token; S.usuario=d.usuario; S.nombre=d.nombre; S.rol=d.rol;
    sessionStorage.setItem('tt', JSON.stringify(S));
    entrar();
  } finally { b.textContent='Entrar'; b.disabled=false; }
});

function entrar(){
  $('#login').classList.add('oculto'); $('#app').classList.remove('oculto');
  $('#quien').textContent=S.nombre||S.usuario; $('#rol').textContent=S.rol||'';
  pintar();
}
$('#salir').onclick=()=>{sessionStorage.removeItem('tt');location.reload();};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); S.modulo=b.dataset.m; S.salida=null; pintar();
});

function pronto(t,items){return `<div class="pronto"><b>${t}</b>Este módulo está en construcción.
  <ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;}

async function pintar(){
  if(S.modulo==='clientes') return clientes();
  if(S.modulo==='cobros') return S.salida?listaPax():cobros();
  if(S.modulo==='retargeting') return retargeting();
  if(S.modulo==='bot') return botM();
  if(S.modulo==='tareas') return tareas();
  if(S.modulo==='citas') return citas();
}

async function retargeting(){
  const v=$('#vista');
  v.innerHTML=`<h2>Retargeting</h2><p class="sub">Gente que preguntó y no cerró. Sale del barrido diario de WhatsApp.</p>
    <div id="kpis" class="kpis" style="margin-top:18px"></div>
    <div class="tarj scroll" id="tabla"><div class="vacio">Cargando…</div></div>`;
  const d=await api('sistema-retargeting',{});
  if(!d.ok){$('#tabla').innerHTML=`<div class="vacio">${esc(d.error||'Error')}</div>`;return;}
  $('#kpis').innerHTML=`<div class="kpi"><span>Leads sin cerrar</span><b>${d.total}</b></div>
    <div class="kpi"><span>Calientes</span><b style="color:var(--alerta)">${d.porNivel.caliente}</b></div>
    <div class="kpi"><span>Tibios</span><b style="color:var(--aviso)">${d.porNivel.tibio}</b></div>
    <div class="kpi"><span>Sin contactar</span><b>${d.sinContactar}</b></div>
    <div class="kpi"><span>Destino más pedido</span><b style="font-size:15px">${esc((d.topDestinos[0]||{}).destino||'—')}</b></div>`;
  $('#tabla').innerHTML=`<table><thead><tr><th>Lead</th><th>Destino</th><th>Nivel</th><th>Última vez</th>
    <th>Qué pasó</th><th>Estado</th></tr></thead><tbody>${
    d.leads.map(l=>`<tr>
      <td><b>${esc(l.nombre)}</b><br><span class="sub">${esc(l.telefono)}${l.tipo&&!/marcable/i.test(l.tipo)?' · '+esc(l.tipo):''}</span></td>
      <td>${esc(l.destino)}</td>
      <td><span class="chip ${l.nivel==='caliente'?'c-al':l.nivel==='tibio'?'c-av':'c-gr'}">${esc(l.nivel)}</span></td>
      <td class="sub">${esc(l.fecha)}</td>
      <td style="max-width:340px"><span class="sub">${esc(l.resumen||l.motivo)}</span></td>
      <td>${l.resultado?`<span class="chip ${/no cerr/i.test(l.resultado)?'c-al':'c-ok'}">${esc(l.resultado)}</span>`
        :l.estado?`<span class="chip c-gr">${esc(l.estado)}</span>`:'<span class="chip c-av">sin contactar</span>'}</td>
    </tr>`).join('')}</tbody></table>`;
}

async function botM(){
  const v=$('#vista');
  v.innerHTML=`<h2>Bot</h2><p class="sub">Conversaciones de WhatsApp que atiende Charly.</p>
    <div id="kpis" class="kpis" style="margin-top:18px"></div>
    <div class="tarj scroll" id="tabla"><div class="vacio">Cargando…</div></div>`;
  const d=await api('sistema-bot',{});
  if(!d.ok){$('#tabla').innerHTML=`<div class="vacio">${esc(d.error||'Error')}</div>`;return;}
  $('#kpis').innerHTML=`<div class="kpi"><span>Conversaciones hoy</span><b>${d.hoy}</b></div>
    <div class="kpi"><span>Esperando respuesta</span><b style="color:${d.esperando?'var(--alerta)':'var(--ok)'}">${d.esperando}</b></div>
    <div class="kpi"><span>Chats en total</span><b>${d.total.toLocaleString('es-CR')}</b></div>
    <div class="kpi"><span>Sin número marcable</span><b>${d.noMarcables.toLocaleString('es-CR')}</b></div>`;
  $('#tabla').innerHTML=`<table><thead><tr><th>Cliente</th><th>Teléfono</th><th>Último mensaje</th>
    <th>Cuándo</th><th></th></tr></thead><tbody>${
    d.chats.map(ch=>`<tr><td><b>${esc(ch.nombre)}</b></td>
      <td>${ch.telefono==='(no marcable)'?'<span class="sub">(no marcable)</span>':esc(ch.telefono)}</td>
      <td style="max-width:380px"><span class="sub">${esc(ch.ultimo||'—')}</span></td>
      <td class="sub">${esc(ch.cuando)}</td>
      <td>${ch.esperando?'<span class="chip c-al">esperando</span>':'<span class="chip c-ok">contestado</span>'}</td>
    </tr>`).join('')}</tbody></table>`;
}

async function tareas(){
  const v=$('#vista');
  v.innerHTML=`<h2>Tareas y seguimientos</h2><p class="sub">Lo que hay que hacer hoy, con quién lo tiene.</p>
    <div class="barra"><button class="btn chico" id="nueva">+ Nueva tarea</button></div>
    <div id="kpis" class="kpis"></div>
    <div class="tarj scroll" id="tabla"><div class="vacio">Cargando…</div></div>
    <div id="hechas" style="margin-top:22px"></div>`;
  $('#nueva').onclick=nuevaTarea;
  const d=await api('sistema-tareas',{});
  if(!d.ok){$('#tabla').innerHTML=`<div class="vacio">${esc(d.error||'Error')}</div>`;return;}
  const t=d.totales;
  $('#kpis').innerHTML=`<div class="kpi"><span>Abiertas</span><b>${t.abiertas}</b></div>
    <div class="kpi"><span>Vencidas</span><b style="color:${t.vencidas?'var(--alerta)':'var(--ok)'}">${t.vencidas}</b></div>
    <div class="kpi"><span>Para hoy</span><b>${t.hoy}</b></div>
    <div class="kpi"><span>Cerradas</span><b>${t.cerradas}</b></div>`;
  if(!d.tareas.length){$('#tabla').innerHTML='<div class="vacio">No hay tareas abiertas 🎉</div>';return;}
  $('#tabla').innerHTML=`<table><thead><tr><th>Tarea</th><th>Cliente</th><th>Quién</th><th>Vence</th></tr></thead><tbody>${
    d.tareas.map(x=>`<tr><td><b>${esc(x.titulo)}</b>${x.detalle?`<br><span class="sub">${esc(x.detalle)}</span>`:''}</td>
      <td>${esc(x.cliente||'—')}${x.telefono?`<br><span class="sub">${esc(x.telefono)}</span>`:''}</td>
      <td>${esc(x.asignada_a)}</td>
      <td>${x.vencida?`<span class="chip c-al">${esc(x.vence)}</span>`:`<span class="chip c-gr">${esc(x.vence)}</span>`}</td>
    </tr>`).join('')}</tbody></table>`;
}

function nuevaTarea(){
  const t=prompt('¿Qué hay que hacer?'); if(!t) return;
  const cli=prompt('¿Para cuál cliente? (opcional)')||'';
  const tel=prompt('Teléfono (opcional)')||'';
  const v=prompt('¿Para qué día? (aaaa-mm-dd)', new Date(Date.now()-6*3600*1000).toISOString().slice(0,10))||'';
  api('sistema-tareas',{op:'nueva',titulo:t,cliente:cli,telefono:tel,vence:v,tipo:'tarea'}).then(r=>{
    if(!r.ok) return alert(r.error||'No se pudo guardar'); tareas();
  });
}

async function citas(){
  const v=$('#vista');
  v.innerHTML=`<h2>Citas</h2><p class="sub">Agenda de la oficina. Se llena sola con las que agenda el bot.</p>
    <div id="kpis" class="kpis" style="margin-top:18px"></div><div id="lista"></div>`;
  const d=await api('sistema-citas',{});
  if(!d.ok){$('#lista').innerHTML=`<div class="tarj"><div class="vacio">${esc(d.error||'Error')}</div></div>`;return;}
  $('#kpis').innerHTML=`<div class="kpi"><span>Citas hoy</span><b>${d.totales.hoy}</b></div>
    <div class="kpi"><span>Próximos 30 días</span><b>${d.totales.proximas}</b></div>`;
  if(!d.dias.length){$('#lista').innerHTML=`<div class="tarj"><div class="vacio">No hay citas agendadas.<br>
    <span class="sub">Cuando el bot agende una, aparece acá sola.</span></div></div>`;return;}
  $('#lista').innerHTML=d.dias.map(g=>`<div class="tarj" style="margin-bottom:14px">
    <table><thead><tr><th colspan="3">${g.dia===d.hoy?'Hoy · ':''}${esc(g.dia)}</th></tr></thead><tbody>${
    g.citas.map(c=>`<tr><td style="width:110px"><b>${esc(c.hora)}</b>${c.horaFin?`<span class="sub"> a ${esc(c.horaFin)}</span>`:''}</td>
      <td><b>${esc(c.titulo)}</b>${c.detalle?`<br><span class="sub">${esc(c.detalle)}</span>`:''}</td>
      <td class="sub">${esc(c.donde||'')}</td></tr>`).join('')}</tbody></table></div>`).join('');
}

async function clientes(q){
  const v=$('#vista');
  v.innerHTML=`<h2>Clientes</h2><p class="sub">Base histórica de clientes por destino.</p>
    <div class="barra"><input type="search" id="q" placeholder="Buscar por nombre, cédula, teléfono o pasaporte…" value="${esc(q||'')}">
    <button class="btn chico" id="bq">Buscar</button><span class="sub" id="info"></span></div>
    <div class="tarj scroll" id="tabla"><div class="vacio">Cargando…</div></div>`;
  $('#bq').onclick=()=>clientes($('#q').value);
  $('#q').onkeydown=e=>{if(e.key==='Enter')clientes($('#q').value);};
  const d=await api('sistema-clientes',{q:q||''});
  if(!d.ok){$('#tabla').innerHTML=`<div class="vacio">${esc(d.error||'Error')}</div>`;return;}
  $('#info').textContent=`${d.mostrados} de ${d.total.toLocaleString('es-CR')} clientes`;
  if(!d.clientes.length){$('#tabla').innerHTML='<div class="vacio">Sin resultados</div>';return;}
  $('#tabla').innerHTML=`<table><thead><tr><th>Nombre</th><th>Cédula</th><th>Teléfono</th>
    <th>Pasaporte</th><th class="num">Viajes</th><th>Destinos</th></tr></thead><tbody>${
    d.clientes.map(c=>`<tr><td><b>${esc(c.nombre)}</b></td><td>${esc(c.cedula)}</td>
      <td>${esc(c.telefono)}</td>
      <td>${c.pasaporteLink?`<a class="link" href="${esc(c.pasaporteLink)}" target="_blank" rel="noopener">${esc(c.pasaporte||'ver')}</a>`:esc(c.pasaporte)}</td>
      <td class="num">${c.viajes}</td>
      <td>${c.destinos.slice(0,3).map(x=>`<span class="chip c-gr">${esc(x)}</span>`).join(' ')}${c.destinos.length>3?` <span class="sub">+${c.destinos.length-3}</span>`:''}</td></tr>`).join('')}</tbody></table>`;
}

async function cobros(){
  const v=$('#vista');
  v.innerHTML=`<h2>Cobros</h2><p class="sub">Salidas en venta. Entrá a una para ver abonos y saldos.</p>
    <div class="tarj scroll" id="tabla" style="margin-top:18px"><div class="vacio">Cargando…</div></div>`;
  const d=await api('sistema-cobros',{});
  if(!d.ok){$('#tabla').innerHTML=`<div class="vacio">${esc(d.error||'Error')}</div>`;return;}
  $('#tabla').innerHTML=`<table><thead><tr><th>Tour</th><th>Sale</th><th>Regresa</th><th>Estado</th><th></th></tr></thead><tbody>${
    d.salidas.map((s,i)=>`<tr><td><b>${esc(s.tour)}</b></td><td>${esc(s.sale)}</td><td>${esc(s.regresa)}</td>
      <td><span class="chip ${/vendido/i.test(s.estado)?'c-al':/preventa/i.test(s.estado)?'c-av':'c-ok'}">${esc(s.estado)}</span></td>
      <td class="num"><a class="link" data-i="${i}">Ver lista →</a></td></tr>`).join('')}</tbody></table>`;
  document.querySelectorAll('[data-i]').forEach(a=>a.onclick=()=>{S.salida=d.salidas[+a.dataset.i];pintar();});
}

async function listaPax(){
  const s=S.salida, v=$('#vista');
  v.innerHTML=`<h2>${esc(s.tour)}</h2><p class="sub">Sale el ${esc(s.sale)} · regresa el ${esc(s.regresa)}</p>
    <div class="barra"><button class="btn chico gris" id="volver">← Salidas</button>
    <a class="link" href="https://docs.google.com/spreadsheets/d/${esc(s.hoja)}/edit" target="_blank" rel="noopener">Abrir el Excel</a></div>
    <div id="kpis" class="kpis"></div>
    <div class="tarj scroll" id="tabla"><div class="vacio">Cargando…</div></div>`;
  $('#volver').onclick=()=>{S.salida=null;pintar();};
  const d=await api('sistema-lista',{hoja:s.hoja,pestana:'BUS#1'});
  if(!d.ok){$('#tabla').innerHTML=`<div class="vacio">${esc(d.error||'Error')}</div>`;return;}
  S.pax=d.pasajeros; const t=d.totales;
  $('#kpis').innerHTML=`<div class="kpi"><span>Pasajeros</span><b>${t.personas}</b></div>
    <div class="kpi"><span>Costo total</span><b>${plata(t.costo)}</b></div>
    <div class="kpi"><span>Abonado</span><b>${plata(t.abonado)}</b></div>
    <div class="kpi"><span>Pendiente</span><b style="color:var(--alerta)">${plata(t.debe)}</b></div>
    <div class="kpi"><span>Al día</span><b>${d.aldia} <span class="sub" style="font-size:13px">de ${t.personas}</span></b></div>`;
  $('#tabla').innerHTML=`<table><thead><tr><th>Pasajero</th><th>Teléfono</th><th class="num">Costo</th>
    <th class="num">Abonado</th><th class="num">Debe</th><th>Última actualización</th><th></th></tr></thead><tbody>${
    d.pasajeros.map((p,i)=>`<tr><td><b>${esc(p.nombre)}</b>${p.cedula?`<br><span class="sub">${esc(p.cedula)}</span>`:''}</td>
      <td>${esc(p.telefono)}</td><td class="num">${plata(p.costo)}</td><td class="num">${plata(p.abono)}</td>
      <td class="num">${p.debe>0?`<span class="chip c-al">${plata(p.debe)}</span>`:'<span class="chip c-ok">al día</span>'}</td>
      <td class="sub">${p.quien?esc(p.quien)+'<br>'+esc(p.cuando):'—'}</td>
      <td class="num"><a class="link" data-p="${i}">Abonar</a></td></tr>`).join('')}</tbody></table>`;
  document.querySelectorAll('[data-p]').forEach(a=>a.onclick=()=>abrirAbono(S.pax[+a.dataset.p]));
}

function abrirAbono(p){
  $('#aPax').textContent=p.nombre+' · fila '+p.fila;
  $('#aCosto').value=p.costo; $('#aMonto').value=p.abono;
  $('#dAbono').returnValue=''; $('#dAbono').showModal();
  $('#fAbono').onsubmit=async ev=>{
    if(ev.submitter && ev.submitter.value!=='ok') return;
    ev.preventDefault();
    const b=$('#aGuardar'); b.textContent='Guardando…'; b.disabled=true;
    const d=await api('sistema-abono',{hoja:S.salida.hoja,pestana:'BUS#1',fila:p.fila,
      abono:Number($('#aMonto').value),costo:p.costo});
    b.textContent='Guardar'; b.disabled=false;
    if(!d.ok){alert(d.error||'No se pudo guardar');return;}
    $('#dAbono').close(); listaPax();
  };
}

const g=sessionStorage.getItem('tt');
if(g){try{S=Object.assign(S,JSON.parse(g)); if(S.token) entrar();}catch(e){}}
</script></body></html>
