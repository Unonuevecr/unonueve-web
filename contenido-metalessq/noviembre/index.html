<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Metales SQ · Contenido de noviembre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--azul:#1B4DB1;--navy:#0E2E6E;--tinta:#16213a;--suave:#5b6a86;--linea:#dfe5f0;--fondo:#f4f6fb;--ok:#1f8a4c;--cambio:#c77700;--acento:#FFD27A}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.5}
header{background:var(--azul);color:#fff;padding:28px 16px 24px}
.ancho{max-width:880px;margin:0 auto;padding:0 16px}
header .ancho{padding:0}
h1,h2,h3{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.4px;margin:0}
h1{font-size:32px;line-height:1.1}
header p{margin:8px 0 0;color:#d5e0f5;max-width:640px}
.barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.barra input{flex:1;min-width:200px;padding:11px 14px;border-radius:10px;border:0;font:inherit}
.prog{font-weight:600;color:var(--acento)}
.pieza{background:#fff;border:1px solid var(--linea);border-radius:18px;margin:22px 0;overflow:hidden}
.cab{padding:18px 20px;border-bottom:1px solid var(--linea);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.cab h2{font-size:22px;color:var(--navy)}
.tipo{color:var(--suave);font-size:14px;margin-top:2px}
.chip{font-size:13px;font-weight:600;padding:5px 12px;border-radius:20px;background:#eef2fa;color:var(--suave);white-space:nowrap}
.chip.aprobado{background:#e3f4ea;color:var(--ok)}.chip.cambios{background:#fff2dc;color:var(--cambio)}
.cuerpo{padding:18px 20px;display:grid;gap:18px}
.media{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.media img{height:380px;border-radius:12px;flex:none}
.media video{height:520px;max-width:100%;border-radius:12px;background:#000;flex:none}
.bloque h3{font-size:16px;color:var(--azul);margin-bottom:6px}
.texto{white-space:pre-wrap;background:var(--fondo);border-radius:12px;padding:14px 16px;font-size:15px}
.refs{margin:0;padding-left:20px}.refs li{margin-bottom:8px}.refs a{color:var(--azul);font-weight:600}.refs span{color:var(--suave);font-size:14px;display:block}
.archivos a{display:inline-block;margin-right:10px;color:var(--azul);font-weight:600}
.copiar{border:1px solid var(--linea);background:#fff;border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;margin-left:8px}
.revision{border-top:1px solid var(--linea);padding:18px 20px;background:#fbfcff;display:grid;gap:12px}
.botones{display:flex;gap:10px;flex-wrap:wrap}
button.b{border:0;border-radius:12px;padding:12px 18px;font:600 15px "IBM Plex Sans",sans-serif;cursor:pointer}
.b.ap{background:var(--ok);color:#fff}.b.ca{background:var(--cambio);color:#fff}.b.voz{background:#eef2fa;color:var(--navy)}.b.voz.grabando{background:#d93025;color:#fff}
.b.env{background:var(--azul);color:#fff}.b.sel{outline:3px solid var(--acento)}
textarea{width:100%;min-height:90px;border:1px solid var(--linea);border-radius:12px;padding:12px;font:inherit;resize:vertical}
.audio{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.audio audio{max-width:100%}
.aviso{font-size:14px;color:var(--suave)}.aviso.ok{color:var(--ok);font-weight:600}.aviso.err{color:#d93025;font-weight:600}
footer{text-align:center;color:var(--suave);font-size:13px;padding:30px 16px 50px}
@media (max-width:600px){.media img{height:300px}.media video{height:460px}h1{font-size:26px}}
</style>
</head>
<body>
<header><div class="ancho">
  <h1>Metales SQ · Contenido de noviembre</h1>
  <p>Revisá cada pieza: el video o las imágenes, el guion, el texto del post y de dónde salió la información. Aprobala o pedí cambios por escrito o con una nota de voz; nos llega al instante.</p>
  <div class="barra"><input id="quien" placeholder="Tu nombre (para saber quién revisó)"><span class="prog" id="prog"></span></div>
</div></header>
<main class="ancho" id="lista"></main>
<footer>UNONUEVECR · Página privada de revisión para Metales SQ</footer>
<script>
const WEBHOOK="https://n8n-unonueve-n8n.i5i6e4.easypanel.host/webhook/metalessq-contenido";
const PAGINA="https://unonuevecr.com/contenido-metalessq/noviembre/";
const DIAS=[{"fecha": "2026-11-02", "etiqueta": "Lunes 2 de noviembre · Juan y la platina", "tipo": "Reel animado · Platinas y angulares", "estado_pieza": "Video listo para revisar", "imgs": [], "video": "video/02.mp4", "portada": "img/02-portada.jpg", "hd": "hd/02-juan-y-la-platina.mp4", "guion": "Juan llegó a Metales SQ con una duda: ¿para qué sirve una platina?\n\nNuestro vendedor se lo explicó sencillo. La platina es una barra plana de acero macizo. Se corta, se dobla y se suelda fácil. Sirve para rejas y verjas, y para los barrotes y refuerzos de un portón. También para marcos de puertas y ventanas, bisagras, abrazaderas y placas de anclaje.\n\nY le dijo algo importante: sola no carga un techo. Para eso están el tubo y el perlín.\n\nJuan se llevó la medida correcta, desde media hasta dos pulgadas.\n\nY recuerda: búscanos en Waze como Metales SQ y el nombre de tu sucursal favorita. En Coronado, en Tibás, en Alajuela o en Guápiles. O escríbenos al 8739-8634.\n\nMetales SQ. El respaldo de tu obra. Porque sabemos de metal.", "texto": "🔩 ¿Sabés para qué sirve una platina? Juan tampoco sabía… hasta que pasó por Metales SQ.\n\nLa platina es una barra plana de acero macizo: se corta, se dobla y se suelda fácil.\n✅ Rejas y verjas\n✅ Barrotes y refuerzos de portones\n✅ Marcos de puertas y ventanas\n✅ Bisagras, abrazaderas y placas de anclaje\n\n⚠️ Ojo: sola no carga un techo. Para eso están el tubo estructural y el perlín.\n\n📏 La tenés de 1/2\" a 2\", en espesor 1/8\" y 3/16\".\n\n¿No sabés cuál ocupás? Contanos qué vas a construir y te asesoramos.\n\nMetales SQ, el respaldo de tu obra. Porque sabemos de metal. 🔨\n📍 Coronado – Tibás – Guápiles – Alajuela · 📲 8739-8634", "refs": [["Aceros Arequipa — Hoja técnica de platinas (ASTM A36)", "Qué es la platina (acero laminado de sección rectangular), sus usos (estructuras metálicas, puertas, ventanas, rejas, piezas forjadas), barras de 6 m y buena soldabilidad y doblado.", "https://acerosarequipa.com/sites/default/files/fichas/2020-09/hoja-tecnica-platinas.pdf"], ["Universidad Nacional de La Plata — Curso de herrería", "La platina es de cuerpo rectangular macizo, se vende en tramos de 6 m y tiene muy buena soldabilidad.", "https://unlp.edu.ar/frontend/media/52/28252/9da1f2300fce836f53c99d7627819166.pdf"], ["IDEA StatiCa — Pandeo lateral por torsión", "Por qué una pieza delgada sin apoyo lateral se tuerce bajo carga: respalda «sola no carga un techo; para eso están el tubo y el perlín».", "https://www.ideastatica.com/es/blog/lateral-torsional-buckling"], ["Catálogo de productos Metales SQ (oct-2026)", "Medidas que se venden: platina de 1/2\", 3/4\", 1\", 1 1/2\" y 2\" en 1/8\"; 1 1/2\" y 2\" también en 3/16\".", ""]]}, {"fecha": "2026-11-06", "etiqueta": "Viernes 6 de noviembre · Tornillo de techo con empaque", "tipo": "Carrusel · Tornillería", "estado_pieza": "Carrusel listo para revisar", "imgs": ["img/06-1.jpg", "img/06-2.jpg", "img/06-3.jpg"], "video": "", "portada": "", "hd": "hd/metalessq-noviembre-06.zip", "guion": "", "texto": "¿Cambiaste el techo y sigue goteando? 🌧️ Muchas veces no es la lámina: es el tornillo.\n\nEl tornillo de techo con empaque hace tres trabajos de una sola pasada:\n1️⃣ Perfora: la punta broca abre el metal sin pretaladrar.\n2️⃣ Aprieta: la rosca agarra la lámina al perlín.\n3️⃣ Sella: el empaque cierra el hueco para que no pase el agua.\n\nLo tenés en punta broca (para perlín y tubo) y punta fina (para madera), en 1\", 2\" y 2 1/2\". 🔩\n\nLlevalo en la misma compra que la lámina y el techo queda cerrado.\n\n📍 Coronado – Tibás – Guápiles – Alajuela · 📲 8739-8634", "refs": [["Catálogo de productos Metales SQ (oct-2026) · Tornillería", "Tornillo de techo en 1\", 2\" y 2 1/2\", punta broca y punta fina.", ""], ["Texto alternativo para Instagram y Facebook (SEO)", "1) Tornillo de techo con empaque punta broca, galvanizado, para lámina de techo. 2) Partes del tornillo de techo: cabeza hexagonal, arandela con empaque, rosca y punta broca; medidas 1, 2 y 2 1/2 pulgadas. 3) Sucursales de Metales SQ en Coronado, Tibás, Alajuela y Guápiles; WhatsApp 8739-8634.", ""]]}, {"fecha": "2026-11-16", "etiqueta": "Lunes 16 de noviembre · Doña Ana y los angulares", "tipo": "Reel animado · Platinas y angulares", "estado_pieza": "Guion para aprobar (el video se hace después)", "imgs": [], "video": "", "portada": "", "hd": "", "guion": "El constructor mandó a doña Ana a traer angulares. Pero doña Ana tenía una duda: ¿para qué sirven?\n\nNuestro vendedor se lo explicó así: «Doña Ana, el angular son dos alas de acero en forma de ele, a noventa grados. Esa forma lo hace rígido sin que pese mucho».\n\nSirve para marcos de portones, rejas y ventanas; para estantes y mesas de trabajo; y para soportes, ménsulas y esquinas que hay que proteger.\n\n«Y ojo», le dijo, «solo no se usa como columna ni como viga de techo: en un tramo largo y sin apoyo se tuerce. Para eso está el tubo estructural».\n\nY le ayudó con la medida: de una a dos pulgadas; un octavo para trabajo liviano, y tres dieciseisavos si va a cargar.\n\nDoña Ana llegó con una duda y volvió a la obra con el angular correcto.\n\nY recuerda: búscanos en Waze como Metales SQ y el nombre de tu sucursal favorita. En Coronado, en Tibás, en Alajuela o en Guápiles. O escríbenos al 8739-8634.\n\nMetales SQ. El respaldo de tu obra. Porque sabemos de metal.", "texto": "📐 ¿Te mandaron a traer angulares y no sabés para qué sirven? Le pasó a doña Ana.\n\nEl angular son dos alas de acero en forma de L: rígido y liviano.\n✅ Marcos de portones, rejas y ventanas\n✅ Estantes y mesas de trabajo\n✅ Soportes, ménsulas y esquinas\n\n⚠️ Ojo: solo no es columna ni viga de techo. Para cargar está el tubo estructural.\n\n📏 Lo tenés de 1\" a 2\": 1/8\" para trabajo liviano y 3/16\" si va a cargar.\n\n¿Te mandaron por material y no sabés cuál? Escribinos antes de comprar y te decimos.\n\nMetales SQ, el respaldo de tu obra. Porque sabemos de metal. 🔨\n📍 Coronado – Tibás – Guápiles – Alajuela · 📲 8739-8634", "refs": [["Aceros Arequipa — Hoja técnica de ángulos estructurales (ASTM A36)", "Qué es el angular (dos alas iguales a 90°) y sus usos: estructuras, techados, torres, carrocerías, puertas, ventanas y rejas. Barras de 6 m.", "https://acerosarequipa.com/sites/default/files/fichas/2020-09/hoja-tecnica-angulos-estructurales.pdf"], ["Gerdau — Ficha técnica de ángulos A36", "Propiedades del acero A36 (fluencia mínima 250 MPa, resistencia 400–550 MPa).", "https://stg-pe.gerdau.com/sites/pe_gerdau/files/PDF/Ficha%20T%C3%A9cnica%20%C3%81ngulos%20A36.pdf"], ["AISC (Instituto Americano de la Construcción en Acero) — Steelwise, ángulos sencillos", "El ángulo sencillo tiene poca rigidez a la torsión y se pandea torciéndose; la norma AISC 360 (secciones E5 y F10) lo trata aparte. Respalda «solo no es columna ni viga de techo».", "https://www.aisc.org/globalassets/modern-steel/steelwise/102010_oct10_steelwise_web.pdf"], ["Catálogo de productos Metales SQ (oct-2026)", "Medidas que se venden: angular de 1\", 1 1/4\", 1 1/2\" y 2\" en 1/8\"; 2\" también en 3/16\".", ""]]}];
const est={}; const voz={};
const $=s=>document.querySelector(s);
const esc=t=>String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
try{$("#quien").value=localStorage.getItem("sq_quien")||""}catch(e){}
$("#quien").addEventListener("change",e=>{try{localStorage.setItem("sq_quien",e.target.value.trim())}catch(_){}});

function chip(f){const s=(est[f]||{}).estado;return s==="aprobado"?'<span class="chip aprobado">✅ Aprobada</span>':s==="cambios"?'<span class="chip cambios">✏️ Con cambios</span>':'<span class="chip">⏳ Pendiente</span>'}
function pintar(){
  $("#lista").innerHTML=DIAS.map((d,i)=>{
    const media=d.video?`<div class="media"><video src="${d.video}" poster="${d.portada}" controls playsinline preload="metadata"></video>${d.portada?`<img src="${d.portada}" alt="Portada del reel">`:""}</div>`:d.imgs.length?`<div class="media">${d.imgs.map(s=>`<img src="${s}" loading="lazy" alt="">`).join("")}</div>`:"";
    const refs=(d.refs||[]).map(r=>`<li>${r[2]?`<a href="${r[2]}" target="_blank" rel="noopener">${esc(r[0])}</a>`:`<b>${esc(r[0])}</b>`}<span>${esc(r[1])}</span></li>`).join("");
    const e=est[d.fecha]||{};
    return `<section class="pieza" id="p${i}">
      <div class="cab"><div><h2>${esc(d.etiqueta)}</h2><div class="tipo">${esc(d.tipo)} · ${esc(d.estado_pieza)}</div></div>${chip(d.fecha)}</div>
      <div class="cuerpo">${media}
        ${d.guion?`<div class="bloque"><h3>Guion (lo que dice la voz)<button class="copiar" data-c="g${i}">Copiar</button></h3><div class="texto" id="g${i}">${esc(d.guion)}</div></div>`:""}
        <div class="bloque"><h3>Texto del post<button class="copiar" data-c="t${i}">Copiar</button></h3><div class="texto" id="t${i}">${esc(d.texto)}</div></div>
        ${refs?`<div class="bloque"><h3>Referencias: de dónde sale la información</h3><ol class="refs">${refs}</ol></div>`:""}
        ${d.hd?`<div class="bloque archivos"><h3>Archivos</h3><a href="${d.hd}" download>⬇ Descargar en alta calidad</a></div>`:""}
      </div>
      <div class="revision">
        <div class="botones"><button class="b ap ${e.estado==="aprobado"?"sel":""}" data-a="aprobado" data-i="${i}">✅ Aprobar</button><button class="b ca ${e.estado==="cambios"?"sel":""}" data-a="cambios" data-i="${i}">✏️ Pedir cambios</button></div>
        <textarea id="c${i}" placeholder="Escribí qué hay que cambiar del video, de la imagen o del texto…">${esc(e.comentario||"")}</textarea>
        <div class="audio"><button class="b voz" id="v${i}" data-v="${i}">🎤 Grabar nota de voz</button><span id="va${i}"></span></div>
        <div class="botones"><button class="b env" data-e="${i}">Enviar revisión</button></div>
        <div class="aviso" id="m${i}">${e.actualizado?`Última revisión: ${new Date(e.actualizado).toLocaleString("es-CR")}${e.quien?" · "+esc(e.quien):""}${e.voz?" · con nota de voz":""}`:""}</div>
      </div></section>`}).join("");
  const n=DIAS.filter(d=>(est[d.fecha]||{}).estado==="aprobado").length;$("#prog").textContent=`${n} de ${DIAS.length} aprobadas`;
}
const elegido={};
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.c){navigator.clipboard.writeText($("#"+b.dataset.c).innerText);b.textContent="Copiado ✓";return}
  if(b.dataset.a){const i=b.dataset.i;elegido[i]=b.dataset.a;b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b));if(b.dataset.a==="aprobado")enviar(i);return}
  if(b.dataset.v){grabar(b.dataset.v,b);return}
  if(b.dataset.e){enviar(b.dataset.e)}
});
let rec=null,trozos=[];
async function grabar(i,b){
  if(rec&&rec.state==="recording"){rec.stop();return}
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    const tipo=["audio/webm;codecs=opus","audio/mp4","audio/ogg"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||"";
    rec=new MediaRecorder(s,tipo?{mimeType:tipo}:{});trozos=[];
    rec.ondataavailable=e=>e.data.size&&trozos.push(e.data);
    rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());const blob=new Blob(trozos,{type:rec.mimeType||"audio/webm"});
      const r=new FileReader();r.onload=()=>{voz[i]={b64:r.result,tipo:(rec.mimeType||"audio/webm").split(";")[0]}};r.readAsDataURL(blob);
      $("#va"+i).innerHTML=`<audio controls src="${URL.createObjectURL(blob)}"></audio> <button class="copiar" onclick="delete voz[${i}];this.parentNode.innerHTML=''">Borrar</button>`;
      b.classList.remove("grabando");b.textContent="🎤 Grabar otra nota";};
    rec.start();b.classList.add("grabando");b.textContent="⏹ Detener grabación";
  }catch(e){$("#m"+i).className="aviso err";$("#m"+i).textContent="No se pudo usar el micrófono. Revisá el permiso del navegador."}
}
async function enviar(i){
  const d=DIAS[i],m=$("#m"+i),quien=$("#quien").value.trim();
  if(!quien){m.className="aviso err";m.textContent="Escribí tu nombre arriba antes de enviar.";$("#quien").focus();return}
  const comentario=$("#c"+i).value.trim();const estado=elegido[i]||(comentario||voz[i]?"cambios":(est[d.fecha]||{}).estado||null);
  const p={accion:"guardar",fecha:d.fecha,estado,comentario,quien,pieza:d.etiqueta,pagina:PAGINA};
  if(voz[i]){p.audio=voz[i].b64;p.audioTipo=voz[i].tipo}
  m.className="aviso";m.textContent="Enviando…";
  try{const r=await fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(JSON.stringify(p))});const j=await r.json();
    if(!j.ok)throw 0;est[d.fecha]=j.guardado;delete voz[i];pintar();const m2=$("#m"+i);m2.className="aviso ok";m2.textContent="¡Listo! Tu revisión nos llegó. Gracias, "+quien+".";
  }catch(e){m.className="aviso err";m.textContent="No se pudo enviar. Revisá la conexión e intentá de nuevo."}
}
fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(JSON.stringify({accion:"estado"}))}).then(r=>r.json()).then(j=>{Object.assign(est,j.rows||{});pintar()}).catch(pintar);
pintar();
</script>
</body>
</html>
