  const cls = e.estado==='aprobado'?'aprobado':e.estado==='cambios'?'cambios':'';
  const be = e.estado==='aprobado'?'<span class="estado ok">✓ Aprobada</span>':e.estado==='cambios'?'<span class="estado amb">Pidió cambios</span>':'<span class="estado">Sin revisar</span>';
  const b = [`<span class="badge">${esc(d.eje)}</span>`, `<span class="badge g">${d.imgs.length>1?'Carrusel · '+d.imgs.length+' láminas':PLAN[d.plan]}</span>`];
  if(!lista(d)) b.push(`<span class="badge p">${d.nota?'Se pasó de fecha':d.audio?'Voz lista · falta el video':'Pieza en producción'}</span>`);
  let pieza = '';
  if(d.imgs.length) pieza += `<div class="seccion">${d.imgs.length>1?'Carrusel (deslice para ver las láminas)':'Imagen'}</div><div class="galeria">${d.imgs.map(u=>`<img loading="lazy" src="${u}" alt="Lámina de la publicación" data-full="${u}">`).join('')}</div>`;
  if(d.hist && d.hist.length) pieza += `<div class="seccion">Historias</div><div class="galeria">${d.hist.map(u=>`<img loading="lazy" src="${u}" alt="Historia" data-full="${u}">`).join('')}</div>`;
  if(d.video) pieza += `<div class="seccion">Video${d.titulo?' · «'+esc(d.titulo)+'»':''}</div><video class="vid" controls playsinline preload="none" ${d.poster?`poster="${d.poster}"`:''} src="${d.video}"></video>${d.guion?`<details style="margin-top:10px"><summary>Leer lo que dice la voz</summary><div class="gb">${esc(d.guion)}</div></details>`:''}`;
  if(d.audio) pieza += `<div class="seccion">Voz del video</div><audio controls preload="none" src="${d.audio}"></audio>${d.guion?`<details style="margin-top:10px"><summary>Leer lo que dice la voz</summary><div class="gb">${esc(d.guion)}</div></details>`:''}`;
  if(!lista(d)) pieza += `<div class="seccion">${PLAN[d.plan]}</div><div class="nota">${d.nota?esc(d.nota):(d.plan==='video'?'El video de este día todavía no está editado.':'La imagen de este día todavía está en producción.')+' Apenas esté, aparece aquí. Mientras tanto puede revisar y corregir el texto.'}</div>`;
  let texto = '';
  if(d.texto){
    const t = textoDe(d), corr = !!e.texto;
    texto = `<div class="seccion">Texto de la publicación ${corr?'<span class="tag">Corregido por usted</span>':''}</div>`;
    if(editando[d.fecha]){
      texto += `<textarea class="ed" id="ed-${d.fecha}" aria-label="Texto de la publicación">${esc(t)}</textarea>
        <div class="guardar"><button class="btn pri" data-gt="${d.fecha}">Guardar el texto</button><button class="btn" data-ct="${d.fecha}">Cancelar</button>${corr?`<button class="enl" data-ot="${d.fecha}">Volver al texto original</button>`:''}<span class="msg" id="mt-${d.fecha}"></span></div>`;
    } else {
      texto += `<div class="texto corto" id="tx-${d.fecha}">${esc(t)}</div><button class="enl" data-tx="${d.fecha}">Ver todo el texto ▾</button><button class="enl" data-et="${d.fecha}">✏️ Corregir el texto</button><span class="msg" id="mt-${d.fecha}"></span>`;
    }
  }
  const brief = d.brief ? `<div class="seccion">Idea de la pieza</div><details><summary>Ver qué lleva la pieza</summary><div class="gb">${esc(d.brief)}</div></details>` : '';
  return `<section class="dia ${cls}" id="d-${d.fecha}">
    <div class="dhead"><span class="fecha">${esc(d.etiqueta)}</span><div class="badges">${b.join('')}</div>${be}</div>
    ${pieza}${texto}${brief}
    <div class="acc"><div class="fila">
      <button class="btn ap" data-ap="${d.fecha}" aria-pressed="${e.estado==='aprobado'}">✓ Aprobar</button>
      <button class="btn cb" data-cb="${d.fecha}" aria-pressed="${e.estado==='cambios'}">Pedir un cambio</button></div>
      <textarea id="cm-${d.fecha}" aria-label="Comentario" placeholder="¿Quiere cambiar algo de la imagen o del video? Escríbalo aquí.">${esc(e.comentario||'')}</textarea>
      <div class="guardar"><button class="btn" data-save="${d.fecha}">Guardar comentario</button><span class="msg" id="mg-${d.fecha}"></span></div>
    </div></section>`;
}
function pasa(d){
  const e=(estados[d.fecha]||{}).estado;
  if(filtro==='lista') return lista(d);
  if(filtro==='prod') return !lista(d);
  if(filtro==='pend') return !e;
  if(filtro==='cambios') return e==='cambios';
  return true;
}
function pintar(){ const L=DIAS.filter(pasa); $('#lista').innerHTML = L.length?L.map(tarjeta).join(''):'<p class="sub">No hay publicaciones con este filtro.</p>'; }
function repintar(f){ const v=document.getElementById('d-'+f); if(v){ const n=document.createElement('div'); n.innerHTML=tarjeta(DIAS.find(d=>d.fecha===f)); v.replaceWith(n.firstElementChild); } }
function progreso(){ const ap=DIAS.filter(d=>(estados[d.fecha]||{}).estado==='aprobado').length; $('#progTxt').textContent=`${ap} de ${DIAS.length} aprobadas`; $('#progFill').style.width=(ap/DIAS.length*100)+'%'; }
$('#filtros').innerHTML = FILTROS.map(([k,t])=>`<button data-f="${k}" aria-pressed="${k===filtro}">${t}</button>`).join('');
const lb=$('#lb');
async function enviar(fecha, patch){
  // lo que se escribió en el comentario no se pierde al repintar
  const cm=document.getElementById('cm-'+fecha); const borrador = cm ? cm.value : null;
  estados[fecha]=Object.assign({}, estados[fecha], patch);
  repintar(fecha); progreso();
  const cm2=document.getElementById('cm-'+fecha); if(cm2 && borrador!==null && patch.comentario===undefined) cm2.value=borrador;
  try{
    const p={accion:'guardar', fecha, estado:estados[fecha].estado||null, comentario:estados[fecha].comentario||''};
    if('texto' in patch) p.texto = patch.texto || '';
    const r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(JSON.stringify(p))});
    return r.ok;
  }catch(e){ return false; }
}
function flash(id,msg){ const m=document.getElementById(id); if(m){ m.textContent=msg; if(msg) setTimeout(()=>{ const x=document.getElementById(id); if(x) x.textContent=''; },3200);} }
document.addEventListener('click', async e=>{
  const q = a => e.target.closest('['+a+']');
  const fb=q('data-f'); if(fb){ filtro=fb.dataset.f; [...$('#filtros').children].forEach(b=>b.setAttribute('aria-pressed', b.dataset.f===filtro)); pintar(); return; }
  const im=e.target.closest('.galeria img'); if(im){ lb.querySelector('img').src=im.dataset.full; lb.classList.add('on'); return; }
  if(e.target.closest('.lightbox')){ lb.classList.remove('on'); return; }
  let b;
  if(b=q('data-tx')){ $('#tx-'+b.dataset.tx).classList.remove('corto'); b.remove(); return; }
  if(b=q('data-et')){ const f=b.dataset.et; editando[f]=true; repintar(f); const t=document.getElementById('ed-'+f); if(t) t.focus(); return; }
  if(b=q('data-ct')){ const f=b.dataset.ct; delete editando[f]; repintar(f); return; }
  if(b=q('data-gt')){ const f=b.dataset.gt; const d=DIAS.find(x=>x.fecha===f); const v=document.getElementById('ed-'+f).value.trim();
    if(!v){ flash('mt-'+f,'El texto no puede quedar vacío'); return; }
    delete editando[f]; const ok=await enviar(f,{texto: v===d.texto.trim() ? '' : v}); flash('mt-'+f, ok?'Texto guardado ✓':'No se pudo guardar, vuelva a intentar'); return; }
  if(b=q('data-ot')){ const f=b.dataset.ot; delete editando[f]; const ok=await enviar(f,{texto:''}); flash('mt-'+f, ok?'Se dejó el texto original':'No se pudo guardar, vuelva a intentar'); return; }
  if(b=q('data-ap')){ const f=b.dataset.ap; const on=(estados[f]||{}).estado==='aprobado'; const ok=await enviar(f,{estado:on?null:'aprobado'}); flash('mg-'+f, on?'':(ok?'¡Aprobada! Muchas gracias':'No hubo conexión: vuelva a intentar')); return; }
  if(b=q('data-cb')){ const f=b.dataset.cb; await enviar(f,{estado:'cambios'}); const t=document.getElementById('cm-'+f); if(t) t.focus(); return; }
  if(b=q('data-save')){ const f=b.dataset.save; const c=document.getElementById('cm-'+f).value.trim(); const ok=await enviar(f,{comentario:c, estado:(estados[f]||{}).estado||(c?'cambios':null)}); flash('mg-'+f, ok?'Enviado ✓':'No se pudo enviar, vuelva a intentar'); }
});
pintar(); progreso();
(async()=>{
  try{
    const r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(JSON.stringify({accion:'estado'}))});
    const j=await r.json(); const rows=(j&&j.rows)||{};
    Object.keys(rows).forEach(f=>{ estados[f]={estado:rows[f].estado, comentario:rows[f].comentario, texto:rows[f].texto||''}; });
    pintar(); progreso();
    $('#aviso').innerHTML='En cada publicación puede: ver la pieza, tocar <b>✏️ Corregir el texto</b> para cambiarlo usted mismo, y tocar <b>Aprobar</b> o <b>Pedir un cambio</b>. Todo nos llega al instante.';
  }catch(e){ $('#aviso').textContent='No se pudo conectar para cargar lo ya aprobado. Puede revisar el contenido igual; para aprobar o corregir, vuelva a intentar con conexión.'; }
})();
</script>
</body>
</html>
