    return; }
  if(b=q('data-tx')){ $('#tx-'+b.dataset.tx).classList.remove('corto'); b.remove(); return; }
  if(b=q('data-et')){ const f=b.dataset.et; editando[f]=true; repintar(f); const t=document.getElementById('ed-'+f); if(t) t.focus(); return; }
  if(b=q('data-ct')){ const f=b.dataset.ct; delete editando[f]; repintar(f); return; }
  if(b=q('data-gt')){ const f=b.dataset.gt; const d=DIAS.find(x=>x.fecha===f); const v=document.getElementById('ed-'+f).value.trim();
    if(!v){ flash('mt-'+f,'El texto no puede quedar vacío'); return; }
    delete editando[f]; const ok=await enviar(f,{texto: v===d.texto.trim() ? '' : v}); flash('mt-'+f, ok?'Texto guardado ✓':'No se pudo guardar, vuelva a intentar'); return; }
  if(b=q('data-ot')){ const f=b.dataset.ot; delete editando[f]; const ok=await enviar(f,{texto:''}); flash('mt-'+f, ok?'Se dejó el texto original':'No se pudo guardar, vuelva a intentar'); return; }
  if(b=q('data-ap')){ const f=b.dataset.ap; const on=(estados[f]||{}).estado==='aprobado'; const ok=await enviar(f,{estado:on?null:'aprobado'}); flash('mg-'+f, on?'':(ok?'¡Aprobada! Muchas gracias':'No hubo conexión: vuelva a intentar')); return; }
  if(b=q('data-cb')){ const f=b.dataset.cb; await enviar(f,{estado:'cambios'}); const t=document.getElementById('cm-'+f); if(t) t.focus(); return; }
  if(b=q('data-save')){ const f=b.dataset.save; const c=document.getElementById('cm-'+f).value.trim(); const ok=await enviar(f,{comentario:c, estado:(estados[f]||{}).estado||(c?'cambios':null)}); flash('mg-'+f, ok?'Enviado ✓':'No se pudo enviar, vuelva a intentar'); }
});
pintar(); progreso();
(async()=>{
  try{
    const r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(JSON.stringify({accion:'estado'}))});
    const j=await r.json(); const rows=(j&&j.rows)||{};
    Object.keys(rows).forEach(f=>{ estados[f]={estado:rows[f].estado, comentario:rows[f].comentario, texto:rows[f].texto||''}; });
    pintar(); progreso();
    $('#aviso').innerHTML='En cada publicación puede: ver la pieza, tocar <b>✏️ Corregir el texto</b> para cambiarlo usted mismo, <b>descargarla</b> en alta calidad, y tocar <b>Aprobar</b> o <b>Pedir un cambio</b>. Todo nos llega al instante.';
  }catch(e){ $('#aviso').textContent='No se pudo conectar para cargar lo ya aprobado. Puede revisar el contenido igual; para aprobar o corregir, vuelva a intentar con conexión.'; }
})();
</script>
